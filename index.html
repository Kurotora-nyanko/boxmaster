gular,Menlo,monospace}.pill,.tagChip{display:inline-flex;align-items:center;gap:5px;border:1px solid #b8bec8;border-radius:999px;padding:7px 9px;background:#fff;font-weight:750}.tagChip{background:#f8fafc;font-size:12px}.tagChip.on{background:#111;color:#fff;border-color:#111}.tagBox{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.notice{border-radius:16px;padding:14px;color:#fff}.notice.a{background:var(--green)}.notice.b{background:var(--blue)}.notice.err{background:var(--red)}.big{font-size:28px;font-weight:850}.thumb{width:100%;max-height:260px;object-fit:contain;background:#eee;border-radius:14px;border:1px solid var(--line)}.mini{width:72px;height:72px;object-fit:cover;border-radius:12px;border:1px solid var(--line);background:#eee}.photoMissing{width:72px;height:72px;border-radius:12px;border:1px dashed #b8bec8;background:#f4f4f5;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center}.list{border-top:1px solid var(--line);margin-top:8px}.item{padding:10px 0;border-bottom:1px solid var(--line)}.editgrid{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:start}.dangerZone{border-color:#f1b8b3;background:#fff8f7}.scanCard{scroll-margin-top:76px}#videoWrap{display:none;background:#000;border-radius:16px;overflow:hidden;position:relative;max-height:calc(100svh - 210px)}video{width:100%;display:block;max-height:min(54vh,calc(100svh - 210px));object-fit:cover}.scanFrame{position:absolute;left:50%;top:50%;width:min(84vw,430px);height:min(34vw,150px);min-height:92px;max-height:38%;transform:translate(-50%,-50%);border:3px solid #fffc;border-radius:14px;box-shadow:0 0 0 999px #0003;pointer-events:none}.scanFrame:after{content:"";position:absolute;left:8%;right:8%;top:50%;height:2px;background:#fff9;transform:translateY(-50%)}.scanLabel{position:absolute;top:10px;left:10px;background:#000a;color:#fff;padding:6px 9px;border-radius:999px;font-size:12px}.scanHint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:#000a;color:#fff;padding:7px 10px;border-radius:999px;font-size:12px;white-space:nowrap}.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:#cfd4dc;padding-bottom:env(safe-area-inset-bottom)}.tabs button{border:0;border-radius:0;background:#fff;font-size:12px;padding:11px 2px}.tabs button.active{background:#111;color:#fff}.fabScan{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:45;width:76px;height:76px;border-radius:999px;background:#111;color:#fff;border:2px solid #fff;box-shadow:0 8px 22px #0005;font-size:30px;display:none;align-items:center;justify-content:center;padding:0}.fabScan.show{display:flex}.filterBox{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}.productGrid{display:grid;gap:8px}.productCard{cursor:pointer}.productCard.selected{border-color:#111;box-shadow:0 0 0 2px #111 inset}.productMedia{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:start}.selectMark{width:28px;height:28px;border:2px solid #111;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-weight:900;background:#fff;flex:0 0 auto}.selectMark.on{background:#111;color:#fff}.bulkBar{position:fixed;left:0;right:0;bottom:calc(55px + env(safe-area-inset-bottom));z-index:42;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 18px #0002;padding:10px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}.bulkOverlay{position:fixed;inset:0;background:#0006;z-index:70;display:flex;align-items:flex-end;justify-content:center}.bulkModal{background:#fff;width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}.bulkTagList{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:14px;padding:8px;margin-top:8px}.bulkTagRow{display:flex;align-items:center;gap:8px;padding:7px;border-bottom:1px solid #eef0f3}.bulkTagRow:last-child{border-bottom:0}.bulkMode main{padding-bottom:170px}@media(min-width:720px){.stats{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:repeat(4,1fr)}.bulkModal{border-radius:18px;margin-bottom:24px}.bulkOverlay{align-items:center}}

<body>
<header><h1>BoxMaster BM-001</h1><div class="sub">V2.18 / 倉庫・仮置き場・A-Z箱分類</div></header>
<main>
<section id="home" class="view active"></section>
<section id="scan" class="view"></section>
<section id="products" class="view"></section>

<nav class="tabs"><button data-tab="home" class="active">ホーム</button><button data-tab="scan">スキャン</button><button data-tab="products">商品</button><button data-tab="boxes">箱</button><button data-tab="data">データ</button></nav>

<input id="photoInput" type="file" accept="image/*" capture="environment" style="display:none">
<input id="photoLibraryInput" type="file" accept="image/*" style="display:none">
<script>
const APP_KEY='BM001_V100_DATA';
const PHOTO_DB_NAME='BM001_PHOTO_DB';
const PHOTO_STORE_NAME='photos';
const RESTORE_TEST_KEY='BM001_RESTORE_TEST';
const MASTER_RESTORE_TEST_KEY='BM001_MASTER_RESTORE_TEST';
const HISTORY_LIMIT=5;
const CAMERA_KEY='BM001_CAMERA_DEVICE_ID';
const A_SORT_KEY='BM001_A_SORT';
const PRODUCT_SORT_FIELD_KEY='BM001_PRODUCT_SORT_FIELD';
const PRODUCT_SORT_DIR_KEY='BM001_PRODUCT_SORT_DIR';
const SCAN_DEST_KEY='BM001_SCAN_DEST';
const LAST_SUCCESS_CAMERA_KEY='BM001_LAST_SUCCESS_CAMERA_DEVICE_ID';
const BOX_ITEM_SORT_KEY='BM001_BOX_ITEM_SORT';
const LETTERS='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
let state=emptyState(),legacyState=null,storageLoadFailed=false;
let currentTab='home',scanner=null,selectedJan=null,pendingBoxJan='',pendingBoxFromCamera=false,photoTarget=null,scanMode='scan';
let scanLocked=false,lastScanCode='',lastScanAt=0,historyBusy=false,selectedDeviceId=localStorage.getItem(CAMERA_KEY)||'',currentCameraLabel='自動（背面優先）',currentVideoTrack=null,activeScanControls=null,scanAudioCtx=null;
let lastSuccessfullyScannedProductId='',scanNotice='',scanNoticeKind='info',scanNoticeTimer=null;
let productListTarget='all',productListMode='stock',productListQuery='',tagFilterTags=[],tagFilterMode='AND',productSortField=localStorage.getItem(PRODUCT_SORT_FIELD_KEY)||'created',productSortDir=localStorage.getItem(PRODUCT_SORT_DIR_KEY)||'desc';
let scanDest=localStorage.getItem(SCAN_DEST_KEY)||'warehouse',selectedBoxView='class',selectedBoxClass='',boxItemSort=localStorage.getItem(BOX_ITEM_SORT_KEY)||'last_desc';
let multiSelectMode=false,selectedProductIds=new Set(),bulkTagModal=false,bulkTagQuery='',bulkNewTagText='',bulkExistingTags=new Set();
let photoDbPromise=null,photoCache={};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function generateId(prefix='id'){return (crypto&&crypto.randomUUID)?crypto.randomUUID():`${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,10)}`}
function managementNumber(code){const m=String(code||'').match(/^BM(\d+)$/);return m?parseInt(m[1],10):0}
function formatManagementCode(n){return 'BM'+String(n).padStart(6,'0')}
function issueManagementCode(used=new Set()){let n=Number(state.settings?.nextManagementCodeNumber)||1,code=formatManagementCode(n);while(used.has(code)){n++;code=formatManagementCode(n)}state.settings.nextManagementCodeNumber=n+1;return code}
function productKeyOf(ref){if(state.products[ref])return String(ref);const raw=String(ref||'');if(raw){const found=Object.keys(state.products).find(k=>String(state.products[k].jan||'')===raw||String(state.products[k].managementCode||'').toLowerCase()===raw.toLowerCase()||String(state.products[k].productId||'')===raw);if(found)return found}return raw}
function productKeyById(productId){return Object.keys(state.products).find(k=>state.products[k]&&state.products[k].productId===productId)||''}
function productIdOf(ref){const key=productKeyOf(ref),p=state.products[key];return p&&p.productId?p.productId:''}
function productDisplayJan(p){return p.jan?`JAN: ${esc(p.jan)}`:'バーコードなし'}
function googleJanButtonHtml(p){return p.jan?`<button class="small" onclick="openGoogleJan('${jsq(p.jan)}')">Google検索</button>`:''}
function openGoogleJan(jan){if(!jan)return;window.open('https://www.google.com/search?q='+encodeURIComponent(jan),'_blank','noopener,noreferrer')}
function emptyState(){const classes={};LETTERS.forEach(c=>classes[c]={name:'',enabled:c==='A'});return{schemaVersion:'V2.18',dataSchemaVersion:3,products:{},boxes:[],boxClasses:classes,locations:{warehouseName:'倉庫',stagingName:'仮置き場'},logs:[],undo:[],redo:[],last:null,tags:[],settings:{rememberScanDest:true,nextManagementCodeNumber:1}}}
function isV2State(d){return d&&(d.schemaVersion==='V2.00'||d.schemaVersion==='V2.01'||d.schemaVersion==='V2.02'||d.schemaVersion==='V2.03'||d.schemaVersion==='V2.04'||d.schemaVersion==='V2.05'||d.schemaVersion==='V2.06'||d.schemaVersion==='V2.07'||d.schemaVersion==='V2.08'||d.schemaVersion==='V2.09'||d.schemaVersion==='V2.10'||d.schemaVersion==='V2.11'||d.schemaVersion==='V2.12'||d.schemaVersion==='V2.13'||d.schemaVersion==='V2.14'||d.schemaVersion==='V2.15'||d.schemaVersion==='V2.16'||d.schemaVersion==='V2.17'||d.schemaVersion==='V2.18')}
function load(){try{localStorage.removeItem(RESTORE_TEST_KEY);localStorage.removeItem(MASTER_RESTORE_TEST_KEY);const raw=localStorage.getItem(APP_KEY);if(!raw){state=emptyState();return}const d=JSON.parse(raw);if(isV2State(d)){state=d;migrate();return}legacyState=d;state=emptyState()}catch(e){storageLoadFailed=true;state=emptyState();alert('保存データ読込に失敗しました。安全のため自動保存を停止しました。データ救出用に安全バックアップを確認してください。')}}
function migrate(){const base=emptyState();state.schemaVersion='V2.18';state.dataSchemaVersion=3;state.products=state.products||{};state.boxes=Array.isArray(state.boxes)?state.boxes:[];state.boxClasses={...base.boxClasses,...(state.boxClasses||{})};LETTERS.forEach(c=>{if(!state.boxClasses[c])state.boxClasses[c]={name:'',enabled:false}});state.locations={warehouseName:(state.locations&&state.locations.warehouseName)||'倉庫',stagingName:(state.locations&&state.locations.stagingName)||'仮置き場'};state.logs=Array.isArray(state.logs)?state.logs:[];state.undo=Array.isArray(state.undo)?state.undo.slice(0,HISTORY_LIMIT):[];state.redo=Array.isArray(state.redo)?state.redo.slice(0,HISTORY_LIMIT):[];state.tags=normalizeTags(state.tags);state.settings={rememberScanDest:true,nextManagementCodeNumber:1,...(state.settings||{})};const usedIds=new Set(),usedCodes=new Set();let maxCode=0;const keys=Object.keys(state.products).sort((a,b)=>{const pa=state.products[a]||{},pb=state.products[b]||{};return String(pa.createdAt||'').localeCompare(String(pb.createdAt||''))||a.localeCompare(b)});const baseTime=Date.parse('2020-01-01T00:00:00.000Z');keys.forEach((j,i)=>{const p=normalizeProduct(state.products[j],j,baseTime+i);if(!p.productId||usedIds.has(p.productId))p.productId=generateId('prod');usedIds.add(p.productId);if(!p.managementCode||usedCodes.has(p.managementCode))p.managementCode=issueManagementCode(usedCodes);usedCodes.add(p.managementCode);const n=managementNumber(p.managementCode);if(n>maxCode)maxCode=n});state.settings.nextManagementCodeNumber=Math.max(Number(state.settings.nextManagementCodeNumber)||1,maxCode+1);state.boxes.forEach(b=>{if(!b.boxId)b.boxId=generateId('box');if(!b.id&&b.boxCode)b.id=b.boxCode;b.boxCode=b.id;b.displayName=b.name||b.displayName||b.id;b.classCode=boxClassOf(b.id);if(!b.name)b.name='';if(!b.status)b.status='open';if(!('photoId'in b))b.photoId=''});if(!scanDestExists(scanDest))setScanDest('warehouse',false)}
function compactForQuota(){state.undo=[];state.redo=[];Object.values(state.products||{}).forEach(p=>{delete p.photo});(state.boxes||[]).forEach(b=>{delete b.photo})}
function save(){if(storageLoadFailed||legacyState)throw new Error('保存データ保護中のため保存を中止しました');migrate();try{localStorage.setItem(APP_KEY,JSON.stringify(state))}catch(e){if(!isQuotaError(e))throw e;compactForQuota();migrate();localStorage.setItem(APP_KEY,JSON.stringify(state))}}
function isQuotaError(e){return e&&(e.name==='QuotaExceededError'||/quota|exceeded/i.test(String(e.message||e)))}
function historyData(){return JSON.stringify({products:state.products,boxes:state.boxes,boxClasses:state.boxClasses,locations:state.locations,logs:state.logs,last:state.last,tags:state.tags,settings:state.settings,schemaVersion:'V2.18',dataSchemaVersion:3})}
function snapshot(label){state.undo.unshift({label,at:new Date().toISOString(),data:historyData()});state.undo=state.undo.slice(0,HISTORY_LIMIT);state.redo=[]}
function restoreHistory(h){const d=JSON.parse(h.data);state={...emptyState(),...d};migrate()}
function undo(){if(historyBusy)return;historyBusy=true;render();try{const u=state.undo.shift();if(!u){alert('取り消す操作がありません');return}state.redo.unshift({label:u.label,at:new Date().toISOString(),data:historyData()});state.redo=state.redo.slice(0,HISTORY_LIMIT);restoreHistory(u);save();alert('取り消しました: '+u.label)}finally{historyBusy=false;render()}}
function redo(){if(historyBusy)return;historyBusy=true;render();try{const r=state.redo.shift();if(!r){alert('やり直す操作がありません');return}state.undo.unshift({label:r.label,at:new Date().toISOString(),data:historyData()});state.undo=state.undo.slice(0,HISTORY_LIMIT);restoreHistory(r);save();alert('やり直しました: '+r.label)}finally{historyBusy=false;render()}}
function undoRedoButtons(cls=''){return `<div class="row"><button class="${cls} amber" onclick="undo()" ${historyBusy||!state.undo.length?'disabled':''}>取り消し</button><button class="${cls}" onclick="redo()" ${historyBusy||!state.redo.length?'disabled':''}>やり直し</button></div>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function jsq(s){return String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
function positiveInt(v){const s=String(v??'').trim();if(!/^[1-9]\d*$/.test(s))return 0;return parseInt(s,10)}
function normalizeTags(tags){const out=[];(Array.isArray(tags)?tags:[]).forEach(t=>{const v=String(t??'').trim();if(v&&!out.includes(v))out.push(v)});return out}
function rememberTags(tags){state.tags=normalizeTags([...(state.tags||[]),...normalizeTags(tags)])}
function normalizeTarget(v){if(v===null||v===undefined||v==='')return null;const n=Number(v);return Number.isInteger(n)&&n>=0?n:null}
function normalizeProduct(p,key,fallbackOrder){const keyText=String(key||'');if(!p.productId)p.productId=generateId('prod');if(!p.managementCode)p.managementCode=issueManagementCode(new Set(Object.values(state.products||{}).map(x=>x.managementCode).filter(Boolean)));p.jan=String(p.jan??(/^\d{8}$|^\d{13}$/.test(keyText)?keyText:''));p.name=p.name||'';p.memo=p.memo||'';p.tags=normalizeTags(p.tags);if(!p.createdAt)p.createdAt=new Date(fallbackOrder||Date.now()).toISOString();p.warehouseTarget=normalizeTarget(p.warehouseTarget??p.aTarget);if(p.warehouseTarget===null)p.warehouseTarget=3;delete p.aTarget;if(!p.photoId)p.photoId='';p.locations=p.locations||{};p.locations.warehouse=Math.max(0,parseInt(p.locations.warehouse||0)||0);p.locations.staging=Math.max(0,parseInt(p.locations.staging||0)||0);p.locations.boxes=p.locations.boxes&&typeof p.locations.boxes==='object'?p.locations.boxes:{};p.boxLastAddedAt=p.boxLastAddedAt&&typeof p.boxLastAddedAt==='object'?p.boxLastAddedAt:{};Object.keys(p.locations.boxes).forEach(b=>{const n=parseInt(p.locations.boxes[b]||0)||0;if(n>0)p.locations.boxes[b]=n;else delete p.locations.boxes[b]});return p}
function product(ref){let key=productKeyOf(ref);if(!key)key=generateId('prod');if(!state.products[key])state.products[key]=normalizeProduct({jan:/^\d{8}$|^\d{13}$/.test(key)?key:'',name:'',memo:'',tags:[],photoId:'',createdAt:new Date().toISOString(),warehouseTarget:defaultWarehouseTarget(),locations:{warehouse:0,staging:0,boxes:{}}},key);return normalizeProduct(state.products[key],key)}
function defaultWarehouseTarget(){return 3}
function locName(id){if(id==='warehouse')return state.locations.warehouseName||'倉庫';if(id==='staging')return state.locations.stagingName||'仮置き場';return boxLabel(id)}
function scanDestExists(id){return id==='warehouse'||id==='staging'||!!box(id)}
function setScanDest(id,persist=true){scanDest=scanDestExists(id)?id:'warehouse';if(persist&&state.settings?.rememberScanDest)localStorage.setItem(SCAN_DEST_KEY,scanDest)}
function scanDestOptions(){return['warehouse','staging',...state.boxes.map(b=>b.id).sort(boxSort)]}
function scanDestSelectHtml(){if(!state.settings?.rememberScanDest)scanDest='warehouse';if(!scanDestExists(scanDest))setScanDest('warehouse',false);return`<div class="card" style="margin-top:10px"><label class="muted">入庫先</label><select id="scanDest" onchange="setScanDest(this.value);renderScan()">${scanDestOptions().map(id=>`<option value="${id}" ${scanDest===id?'selected':''}>${locName(id)}${isClosedBoxDest(id)?'（閉じています）':''}</option>`).join('')}</select><div class="muted" style="margin-top:6px">現在の入庫先：${esc(locName(scanDest))}${isClosedBoxDest(scanDest)?'（閉じています）':''}</div></div>`}
function boxClassOf(id){const m=String(id||'').match(/^([A-Z])/);return m?m[1]:''}
function className(code){const c=state.boxClasses[code]||{};return c.name||`分類${code}`}
function box(id){return state.boxes.find(b=>b.id===id)}
function boxLabel(id){const b=box(id),n=b&&b.name;return n?`${esc(n)}（${esc(id)}）`:esc(id)}
function boxText(id){const b=box(id),n=b&&b.name;return n?`${n}（${id}）`:id}
function openBoxes(){return state.boxes.filter(b=>b.status==='open')}
function isBoxDest(id){return id&&id!=='warehouse'&&id!=='staging'}
function isClosedBoxDest(id){const b=isBoxDest(id)?box(id):null;return !!b&&b.status!=='open'}
function closedBoxMessage(id){return `この箱は閉じられているため、商品を追加できません。\n箱を開くか、別の入庫先を選択してください。\n\n対象: ${boxText(id)}`}
function scanNoticeHtml(){if(!scanNotice)return'';const cls=scanNoticeKind==='err'?'err':'b';return`<div class="notice ${cls}" style="margin-top:10px"><b>${scanNoticeKind==='err'?'警告':'注意'}</b><div>${esc(scanNotice)}</div></div>`}
function showScanNotice(msg,kind='info',ms=2500){scanNotice=msg;scanNoticeKind=kind;clearTimeout(scanNoticeTimer);renderScan();scanNoticeTimer=setTimeout(()=>{scanNotice='';if(currentTab==='scan')renderScan()},ms)}
function scheduleScanResume(delay=450){setTimeout(()=>{if(currentTab==='scan'&&!scanner)startScan('scan')},delay)}
function rejectClosedBox(id,fromCamera=false){scanNotice='この箱は閉じられているため、商品を追加できません。箱を開くか、別の入庫先を選択してください。';scanNoticeKind='err';renderScan();if(fromCamera)scheduleScanResume()}
function boxSort(a,b){const ca=boxClassOf(a),cb=boxClassOf(b);if(ca!==cb)return ca.localeCompare(cb);return parseInt(a.slice(1))-parseInt(b.slice(1))||a.localeCompare(b)}

function initScanAudio(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!scanAudioCtx)scanAudioCtx=new C();if(scanAudioCtx.state==='suspended')scanAudioCtx.resume()}catch(e){}}

function openPhotoDb(){if(photoDbPromise)return photoDbPromise;photoDbPromise=new Promise((resolve,reject)=>{const req=indexedDB.open(PHOTO_DB_NAME,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(PHOTO_STORE_NAME))db.createObjectStore(PHOTO_STORE_NAME,{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});return photoDbPromise}

async function getPhotoRecord(id){if(!id)return null;return await new Promise(async(resolve,reject)=>{try{const db=await openPhotoDb();const tx=db.transaction(PHOTO_STORE_NAME,'readonly');const req=tx.objectStore(PHOTO_STORE_NAME).get(id);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error)}catch(e){reject(e)}})}

async function migrateLegacyProducts(){try{const next=emptyState();let okPhoto=0,ngPhoto=0;Object.keys(legacyState.products||{}).forEach(j=>{const p=legacyState.products[j]||{},jan=String(p.jan||j).replace(/\D/g,'');if(!jan)return;next.products[jan]=normalizeProduct({jan,name:p.name||'',memo:p.memo||'',tags:normalizeTags(p.tags),photoId:p.photoId||'',warehouseTarget:normalizeTarget(p.warehouseTarget??p.aTarget)??3,locations:{warehouse:0,staging:0,boxes:{}}},jan)});for(const p of Object.values(next.products)){if(p.photoId){try{const rec=await getPhotoRecord(p.photoId);if(rec&&rec.dataUrl)okPhoto++;else{p.photoId='';ngPhoto++}}catch(e){p.photoId='';ngPhoto++}}}localStorage.setItem(APP_KEY+'_V2_TEST',JSON.stringify(next));JSON.parse(localStorage.getItem(APP_KEY+'_V2_TEST'));localStorage.removeItem(APP_KEY+'_V2_TEST');state=next;legacyState=null;save();render();alert(`商品情報を${Object.keys(state.products).length}件移行しました。\n\n写真を引き継げた商品: ${okPhoto}件\n写真を引き継げなかった商品: ${ngPhoto}件`)}catch(e){alert('移行に失敗しました。旧データは維持しました。\n'+(e.message||e))}}

function performBulkAddTags(productIds,{tags}){const ids=[...new Set(productIds)].filter(Boolean),add=normalizeTags(tags);if(!ids.length)throw new Error('選択商品がありません');if(!add.length)throw new Error('追加するタグを選択または入力してください');const keys=ids.map(productKeyById).filter(Boolean);if(!keys.length)throw new Error('対象商品が見つかりません');const beforeData=historyData();snapshot('一括タグ追加 '+add.join('/'));let changed=0;try{keys.forEach(k=>{const p=state.products[k];if(!p||!p.productId)return;const before=p.tags.length;p.tags=normalizeTags([...p.tags,...add]);if(p.tags.length!==before)changed++});if(!changed){state.undo.shift();throw new Error('変更対象はありませんでした。選択商品には指定タグがすでに付いています')}rememberTags(add);state.last=`一括タグ追加 ${changed}件`;save();return{target:keys.length,changed,tags:add}}catch(e){restoreHistory({data:beforeData});throw e}}

function productCardHtml(jan){const p=product(jan),zero=totalOf(p)===0,on=multiSelectMode&&selectedProductIds.has(p.productId);return`<div class="card productCard ${on?'selected':''}" onclick="productClick('${jan}')"><div class="productMedia"><div>${p.photoId?photoImgHtml(p.photoId,'mini'):'<div class="photoMissing">写真なし</div>'}</div><div><div class="between"><div class="row" style="flex-wrap:nowrap">${selectionMarkHtml(p)}<b>${esc(p.name||p.managementCode||jan)}</b></div>${zero?'<span class="pill">在庫なし</span>':''}</div><div class="mono muted">管理コード: ${esc(p.managementCode)}</div><div class="mono muted">${productDisplayJan(p)}</div>${tagChipsHtml(p.tags,4)}${qtyPills(p)}</div></div></div>`}

function renderSearch(){const rows=productRows();document.getElementById('search').innerHTML=`<div class="card scanCard"><b>検索</b><div class="row" style="margin-top:8px"><input id="searchJan" placeholder="JAN・管理コード・商品名"><button onclick="searchJan(document.getElementById('searchJan').value)">検索</button><button onclick="startScan('search')">カメラ検索</button><button onclick="switchCamera('search')">カメラ切替</button><button onclick="stopScan()">停止</button></div><div id="videoWrap"><video id="video" playsinline></video><div class="scanFrame"></div><div class="scanLabel">JAN読取中</div><div class="scanHint">バーコードを枠内の中央線に合わせてください</div></div><div id="zoomControls" class="row" style="margin-top:8px"></div>${tagFilterHtml()}</div><div id="searchResult">${selectedJan&&!multiSelectMode?productDetailHtml(selectedJan):`<div class="card"><div class="between"><b>検索一覧</b>${bulkControlsHtml()}</div><div class="list">${rows.map(searchProductRowHtml).join('')||'<div class="item muted">該当商品なし</div>'}</div></div>${bulkBarHtml()}`}</div>`}
function searchProductRowHtml(j){const p=product(j),on=multiSelectMode&&selectedProductIds.has(p.productId);return`<div class="item productCard ${on?'selected':''}" onclick="productClick('${j}')"><div class="between"><div><div class="row" style="flex-wrap:nowrap">${selectionMarkHtml(p)}<b>${esc(p.name||p.managementCode||j)}</b></div><div class="mono muted">管理コード: ${esc(p.managementCode)}</div><div class="mono muted">${productDisplayJan(p)}</div>${tagChipsHtml(p.tags,4)}</div>${multiSelectMode?'':`<button class="small" onclick="event.stopPropagation();selectedJan='${j}';render()">詳細</button>`}</div></div>`}
function findProductByQuery(v){const q=String(v||'').trim().toLowerCase(),q2=q.replace(/[-\s]/g,'');if(!q)return'';return Object.keys(state.products).find(k=>{const p=product(k);return k.toLowerCase()===q||String(p.productId||'').toLowerCase()===q||String(p.managementCode||'').toLowerCase()===q2||String(p.jan||'')===q2||(p.name||'').toLowerCase().includes(q)||(p.memo||'').toLowerCase().includes(q)||normalizeTags(p.tags).some(t=>t.toLowerCase().includes(q))})||''}
function searchJan(v){const raw=String(v||'').trim();if(!raw)return;const found=findProductByQuery(raw);if(found)selectedJan=found;else{alert('該当商品がありません');return}pendingBoxJan='';render()}
function renderScan(){document.getElementById('scan').innerHTML=`<div class="card scanCard"><div class="between"><div><b>入庫スキャン</b><div class="muted">入庫先を選んでからJANを読み取ります。${esc(locName('warehouse'))}選択時は倉庫目標数に従います。</div></div>${undoRedoButtons('small')}</div>${scanDestSelectHtml()}${scanNoticeHtml()}<div id="videoWrap"><video id="video" playsinline></video><div class="scanFrame"></div><div class="scanLabel">JAN読取中</div><div class="scanHint">バーコードを枠内の中央線に合わせてください</div></div><div id="zoomControls" class="row" style="margin-top:8px"></div><div class="row" style="margin-top:8px"><button class="primary" onclick="startScan('scan')">カメラで読む</button><button onclick="switchCamera('scan')">カメラ切替</button><button onclick="stopScan()">停止</button></div><div class="row" style="margin-top:8px"><input id="manualJan" inputmode="numeric" placeholder="手入力JAN"><button onclick="manualScan()">登録</button></div></div><div class="card"><b>バーコードなし商品を登録</b><label class="muted">商品名（必須）</label><input id="nbName" placeholder="商品名"><label class="muted">タグ（ / 区切り）</label><input id="nbTags" placeholder="例: ボルト / M6"><label class="muted">メモ</label><textarea id="nbMemo"></textarea><label class="muted">${esc(locName('warehouse'))}目標数</label><input id="nbTarget" type="number" min="0" step="1" value="${defaultWarehouseTarget()}">${inboundControlsHtml('nb',scanDest)}<button class="primary" style="margin-top:8px" onclick="registerNoBarcodeProduct()">登録</button></div><div id="scanResult">${scanResultHtml()}</div>`}
function scanResultHtml(){if(!selectedJan)return'';const p=product(selectedJan);if(pendingBoxJan===selectedJan){return`<div class="notice b"><div class="big">箱を選択</div><div>${esc(p.name||selectedJan)}</div><div class="mono">${selectedJan}</div><div class="muted" style="color:#fff;opacity:.85">箱を選ぶまでは、この1個は未登録です。</div></div><div class="card"><div class="row">${openBoxes().map(b=>`<button onclick="putInBox('${selectedJan}','${b.id}')">${boxLabel(b.id)}</button>`).join('')||'<span class="muted">開いている箱がありません</span>'}<button onclick="addBox()">＋箱追加</button></div></div>`}return`<div class="notice a"><div class="big">${esc(state.last||'登録しました')}</div><div>${esc(p.name||selectedJan)}</div><div class="mono">${selectedJan}</div><div>${esc(locName('warehouse'))}: ${p.locations.warehouse} / ${esc(locName('staging'))}: ${p.locations.staging} / 箱: ${boxTotal(p)}</div></div>`}
function hasPendingBox(){return !!pendingBoxJan}
function cancelPendingBox(){pendingBoxJan='';render()}
function showPendingBoxDialog(onSelect,onCancel){const d=document.createElement('div');d.className='card';if(confirm('この商品はまだ箱が選択されていません。\n登録を完了しますか？\n\nOK: 箱を選択する\nキャンセル: 登録をキャンセル'))onSelect&&onSelect();else onCancel&&onCancel()}
function resolvePendingBeforeLeave(next){if(!hasPendingBox())return true;showPendingBoxDialog(()=>{tab('scan')},()=>{cancelPendingBox();next&&next()});return false}
function normalizeJan(raw){return String(raw||'').replace(/\D/g,'')}
function janCheckDigitOk(code){if(code.length!==8&&code.length!==13)return false;const body=code.slice(0,-1).split('').map(Number),check=Number(code.slice(-1));let sum=0;if(code.length===13)body.forEach((n,i)=>sum+=n*(i%2?3:1));else body.forEach((n,i)=>sum+=n*(i%2?1:3));return(10-(sum%10))%10===check}
function validateJan(raw){const code=normalizeJan(raw);if(code.length!==8&&code.length!==13)return{ok:false,code,reason:'JANは8桁または13桁のみ登録します'};if(!janCheckDigitOk(code))return{ok:false,code,reason:'チェックデジット不一致です'};return{ok:true,code}}
function manualScan(){const el=document.getElementById('manualJan');const v=el.value.trim();if(v)handleCode(v);el.value=''}
function addInbound(jan,to,label,fromCamera=false){if(isClosedBoxDest(to)){rejectClosedBox(to,fromCamera);return false}const before=historyData();try{const key=productKeyOf(jan),p=product(jan);snapshot(label+'取り消し '+(p.managementCode||jan));addQty(p,to,1);state.logs.push({type:'stock',action:'in',productId:p.productId,managementCode:p.managementCode,jan:p.jan||'',to,qty:1,timestamp:new Date().toISOString()});state.last=`${p.managementCode||jan} → ${locName(to)}`;pendingBoxJan='';pendingBoxFromCamera=false;selectedJan=key||jan;save();render();noteSuccessfulScan(p,fromCamera,to);return true}catch(e){try{restoreHistory({data:before})}catch(e2){}render();alert('入庫保存に失敗しました。在庫は変更しませんでした。\n'+(e.message||e));if(fromCamera)scheduleScanResume();return false}}
function handleCode(raw,opt={}){const fromCamera=!!opt.fromCamera,v=validateJan(raw);if(!v.ok){alert(v.reason);if(fromCamera)scheduleScanResume();return}const jan=v.code;if(!scanDestExists(scanDest))setScanDest('warehouse',false);if(isClosedBoxDest(scanDest)){rejectClosedBox(scanDest,fromCamera);return}const p=product(jan);selectedJan=productKeyOf(jan)||jan;if(scanDest==='staging'){addInbound(jan,'staging','仮置き場入庫',fromCamera);return}if(scanDest!=='warehouse'){addInbound(jan,scanDest,'箱直接入庫',fromCamera);return}if(p.locations.warehouse<p.warehouseTarget){addInbound(jan,'warehouse','入庫',fromCamera);return}pendingBoxJan=selectedJan;pendingBoxFromCamera=fromCamera;render()}
function putInBox(jan,boxId){if(isClosedBoxDest(boxId)){alert(closedBoxMessage(boxId));return false}const before=historyData();try{const key=productKeyOf(jan),p=product(jan),fromCamera=pendingBoxFromCamera;snapshot('箱入庫取り消し '+(p.managementCode||jan));addQty(p,boxId,1);state.logs.push({type:'stock',action:'in',productId:p.productId,managementCode:p.managementCode,jan:p.jan||'',to:boxId,qty:1,timestamp:new Date().toISOString()});state.last=`${p.managementCode||jan} → ${boxText(boxId)}`;pendingBoxJan='';pendingBoxFromCamera=false;selectedJan=key||jan;save();render();noteSuccessfulScan(p,fromCamera,boxId);return true}catch(e){try{restoreHistory({data:before})}catch(e2){}render();alert('箱入庫保存に失敗しました。在庫は変更しませんでした。\n'+(e.message||e));return false}}
function cameraConstraints(deviceId=''){const c={width:{ideal:1280},height:{ideal:720}};if(deviceId)c.deviceId={exact:deviceId};else c.facingMode={ideal:'environment'};return{video:c,audio:false}}
async function videoDevices(){try{const ds=await navigator.mediaDevices?.enumerateDevices?.();return(ds||[]).filter(d=>d.kind==='videoinput')}catch(e){return[]}}
async function cameraConstraintCandidates(){const devices=await videoDevices(),ids=new Set(devices.map(d=>d.deviceId).filter(Boolean)),last=localStorage.getItem(LAST_SUCCESS_CAMERA_KEY)||'',manual=selectedDeviceId||'';const out=[];[last,manual].forEach(id=>{if(id&&(!ids.size||ids.has(id)))out.push(cameraConstraints(id))});out.push(cameraConstraints(''));return out}
async function applyNearFocus(video){try{currentVideoTrack=video.srcObject&&video.srcObject.getVideoTracks()[0];const cap=currentVideoTrack&&currentVideoTrack.getCapabilities&&currentVideoTrack.getCapabilities();if(!cap||!currentVideoTrack.applyConstraints)return;const adv={};if(Array.isArray(cap.focusMode)){if(cap.focusMode.includes('continuous'))adv.focusMode='continuous';else if(cap.focusMode.includes('single-shot'))adv.focusMode='single-shot';else if(cap.focusMode.includes('manual'))adv.focusMode='manual'}if(cap.focusDistance&&typeof cap.focusDistance.min==='number')adv.focusDistance=cap.focusDistance.min;if(cap.zoom&&typeof cap.zoom.min==='number'&&typeof cap.zoom.max==='number')adv.zoom=Math.min(cap.zoom.max,Math.max(cap.zoom.min,1.2));if(Object.keys(adv).length)await currentVideoTrack.applyConstraints({advanced:[adv]})}catch(e){}}
function setupZoomControls(video){const box=document.getElementById('zoomControls');if(!box)return;box.innerHTML='';try{currentVideoTrack=video.srcObject&&video.srcObject.getVideoTracks()[0];const cap=currentVideoTrack&&currentVideoTrack.getCapabilities&&currentVideoTrack.getCapabilities();if(!cap||cap.zoom===undefined)return;const vals=[1,1.5,2].filter(v=>v>=cap.zoom.min&&v<=cap.zoom.max);if(!vals.length)return;box.innerHTML='<span class="muted">ズーム</span>'+vals.map(v=>`<button class="small" onclick="applyZoom(${v})">${v}倍</button>`).join('')}catch(e){}}
async function applyZoom(v){try{if(currentVideoTrack)await currentVideoTrack.applyConstraints({advanced:[{zoom:v}]})}catch(e){}}
async function switchCamera(mode=scanMode){const devices=await videoDevices();if(!devices.length){alert('切り替え可能なカメラが見つかりません');return}const current=(currentVideoTrack&&currentVideoTrack.getSettings&&currentVideoTrack.getSettings().deviceId)||selectedDeviceId;let idx=devices.findIndex(d=>d.deviceId===current);idx=(idx+1+devices.length)%devices.length;selectedDeviceId=devices[idx].deviceId;currentCameraLabel=devices[idx].label||'カメラ';localStorage.setItem(CAMERA_KEY,selectedDeviceId);startScan(mode)}
function scanElements(mode=scanMode){const root=document.getElementById(mode==='search'?'search':'scan');return{root,video:root&&root.querySelector('video'),wrap:root&&root.querySelector('#videoWrap'),zoom:root&&root.querySelector('#zoomControls')}}
async function startScan(mode='scan'){stopScan();initScanAudio();scanMode=mode;scanLocked=false;const {video,wrap}=scanElements(mode);if(!video||!wrap||!window.ZXingBrowser){alert('カメラ読取ライブラリを読み込めません');return}wrap.style.display='block';setTimeout(()=>wrap.scrollIntoView({block:'center',behavior:'smooth'}),80);let lastErr=null;const onResult=(res,err,controls)=>{if(controls)activeScanControls=controls;if(res&&!scanLocked){const code=String(res.getText?res.getText():res.text||'');const now=Date.now();if(code===lastScanCode&&now-lastScanAt<700)return;scanLocked=true;lastScanCode=code;lastScanAt=now;try{const id=currentVideoTrack&&currentVideoTrack.getSettings&&currentVideoTrack.getSettings().deviceId;if(id)selectedDeviceId=id}catch(e){}stopScan(false);if(scanMode==='search')searchJan(code);else handleCode(code,{fromCamera:true})}};try{const candidates=await cameraConstraintCandidates();for(const constraints of candidates){try{const reader=new ZXingBrowser.BrowserMultiFormatReader();scanner=reader;if(reader.decodeFromConstraints)activeScanControls=await reader.decodeFromConstraints(constraints,video,onResult);else activeScanControls=await reader.decodeFromVideoDevice(selectedDeviceId||undefined,video,onResult);await applyNearFocus(video);setupZoomControls(video);return}catch(e){lastErr=e;try{stopScan(false);wrap.style.display='block'}catch(e2){}}}throw lastErr||new Error('カメラを開始できません')}catch(e){stopScan();alert('カメラ開始失敗: '+(e.message||e))}}
function stopScan(clear=true){try{activeScanControls&&activeScanControls.stop&&activeScanControls.stop()}catch(e){}try{scanner&&scanner.stop&&scanner.stop()}catch(e){}try{scanner&&scanner.reset&&scanner.reset()}catch(e){}activeScanControls=null;scanner=null;currentVideoTrack=null;document.querySelectorAll('video').forEach(v=>{try{v.pause&&v.pause();v.srcObject&&v.srcObject.getTracks().forEach(t=>t.stop());v.srcObject=null;v.removeAttribute('src');v.load&&v.load()}catch(e){}});document.querySelectorAll('#videoWrap').forEach(w=>w.style.display='none');document.querySelectorAll('#zoomControls').forEach(z=>z.innerHTML='');if(clear)scanLocked=false}
function inboundControlsHtml(prefix='add',defaultDest=''){const selected=scanDestExists(defaultDest)?defaultDest:(scanDestExists(scanDest)?scanDest:'warehouse');return`<div class="row" style="margin-top:8px"><label class="muted">入庫先</label><select id="${prefix}Dest">${scanDestOptions().map(id=>`<option value="${id}" ${selected===id?'selected':''}>${locName(id)}${isClosedBoxDest(id)?'（閉じています）':''}</option>`).join('')}</select><label class="muted">数量</label><div class="row" style="gap:10px"><button type="button" onclick="stepAnyQty('${prefix}Qty',-1)">－</button><span id="${prefix}QtyText" class="pill" style="min-width:58px;justify-content:center">1</span><button type="button" onclick="stepAnyQty('${prefix}Qty',1)">＋</button><input id="${prefix}Qty" type="hidden" value="1"></div></div>`}
function productDetailHtml(jan){const p=product(jan),boxes=Object.entries(p.locations.boxes).sort((a,b)=>boxSort(a[0],b[0]));return`<div class="card"><div class="between"><div><b>${esc(p.name||p.managementCode||jan)}</b><div class="mono muted">管理コード: ${esc(p.managementCode)}</div><div class="row" style="margin-top:4px"><span class="mono muted">${productDisplayJan(p)}</span>${googleJanButtonHtml(p)}</div>${tagChipsHtml(p.tags,99)}</div>${p.photoId?photoImgHtml(p.photoId,'mini'):''}</div>${qtyPills(p)}<div class="list">${boxes.map(([bid,n])=>`<div class="item between"><span>${boxLabel(bid)}</span><b>${n}個</b></div>`).join('')||'<div class="item muted">箱在庫なし</div>'}</div></div><div class="card"><b>在庫を追加</b>${inboundControlsHtml('add')}<button style="margin-top:8px" onclick="addStockFromDetail('${jan}')">在庫を追加</button></div>${moveStockHtml(jan,p)}<div class="card"><b>商品情報</b><label class="muted">商品名</label><input id="pName" value="${esc(p.name)}"><label class="muted">JAN（空欄可）</label><input id="pJan" inputmode="numeric" value="${esc(p.jan)}" placeholder="バーコードなし"><label class="muted">メモ</label><textarea id="pMemo">${esc(p.memo)}</textarea><label class="muted">${esc(locName('warehouse'))}目標数</label><input id="pTarget" type="number" min="0" step="1" value="${p.warehouseTarget}"><div class="row"><button onclick="saveProductInfo('${jan}')">保存</button><button onclick="takePhoto('product','${jan}','camera')">カメラで撮影</button><button onclick="takePhoto('product','${jan}','library')">写真を選択</button>${p.photoId?`<button class="red" onclick="deletePhoto('product','${jan}')">写真削除</button>`:''}</div>${photoImgHtml(p.photoId,'thumb')}${photoPlaceholderHtml(p.photoId)}</div>${tagEditorHtml(jan)}<div class="card dangerZone"><b>商品削除</b><div class="muted">商品情報と在庫を削除します。Undoで戻せます。</div><button class="red" onclick="deleteProduct('${jan}')">この商品を削除</button></div>`}
function locationOptionsForSource(p){const opts=[];if(p.locations.warehouse>0)opts.push('warehouse');if(p.locations.staging>0)opts.push('staging');Object.keys(p.locations.boxes).filter(b=>p.locations.boxes[b]>0).sort(boxSort).forEach(b=>opts.push(b));return opts}
function allDestLocations(){return['warehouse','staging',...state.boxes.map(b=>b.id).sort(boxSort),'remove_stock']}
function destLabel(id){return id==='remove_stock'?'在庫から削除':locName(id)}
function updateMoveActionLabel(){const to=document.getElementById('moveTo')?.value,btn=document.getElementById('moveActionBtn'),note=document.getElementById('moveRemoveNote');if(btn)btn.textContent=to==='remove_stock'?'在庫を減らす':'移動';if(note)note.style.display=to==='remove_stock'?'block':'none'}
function stepMoveQty(delta){const el=document.getElementById('moveQty');if(!el)return;const n=Math.max(1,(parseInt(el.value||'1',10)||1)+delta);el.value=n;document.getElementById('moveQtyText').textContent=n}
function stepAnyQty(id,delta,min=1){const el=document.getElementById(id);if(!el)return;const n=Math.max(min,(parseInt(el.value||String(min),10)||min)+delta);el.value=n;const t=document.getElementById(id+'Text');if(t)t.textContent=n}
function duplicateJanExists(jan,currentKey){return !!jan&&Object.keys(state.products).some(k=>k!==currentKey&&String(state.products[k].jan||'')===jan)}
function addStockToProduct(ref,to,qty,label='在庫追加'){if(isClosedBoxDest(to)){alert(closedBoxMessage(to));return false}const key=productKeyOf(ref),p=product(key);snapshot(label+'取り消し '+(p.managementCode||key));addQty(p,to,qty);state.logs.push({type:'stock',action:'manual_add',productId:p.productId,managementCode:p.managementCode,jan:p.jan||'',to,qty,timestamp:new Date().toISOString()});state.last=`${p.managementCode} → ${locName(to)} ${qty}個`;selectedJan=key;save();render();return true}
function addStockFromDetail(ref){const to=document.getElementById('addDest')?.value,qty=positiveInt(document.getElementById('addQty')?.value);if(!to||!scanDestExists(to)){alert('入庫先を選択してください');return}if(!qty){alert('数量は1以上で指定してください');return}addStockToProduct(ref,to,qty,'在庫追加')}
function registerNoBarcodeProduct(){const name=document.getElementById('nbName')?.value.trim(),target=normalizeTarget(document.getElementById('nbTarget')?.value),to=document.getElementById('nbDest')?.value,qty=parseInt(document.getElementById('nbQty')?.value||'1',10)||0;if(!name){alert('商品名を入力してください');return}if(target===null){alert('目標数は0以上の整数で入力してください');return}if(!to||!scanDestExists(to)){alert('入庫先を選択してください');return}if(isClosedBoxDest(to)){alert(closedBoxMessage(to));return}if(qty<1){alert('初期数量は1以上で登録してください');return}if(Object.values(state.products).some(p=>(p.name||'')===name)&&!confirm('同じ商品名の商品があります。このまま登録しますか？'))return;const productId=generateId('prod'),key=productId,managementCode=issueManagementCode(new Set(Object.values(state.products).map(p=>p.managementCode).filter(Boolean)));snapshot('バーコードなし商品登録 '+managementCode);state.products[key]=normalizeProduct({productId,managementCode,jan:'',name,memo:document.getElementById('nbMemo')?.value||'',tags:normalizeTags(String(document.getElementById('nbTags')?.value||'').split('/')),photoId:'',createdAt:new Date().toISOString(),warehouseTarget:target,locations:{warehouse:0,staging:0,boxes:{}}},key);rememberTags(state.products[key].tags);if(qty>0){addQty(state.products[key],to,qty);state.logs.push({type:'stock',action:'manual_add',productId,managementCode,jan:'',to,qty,timestamp:new Date().toISOString()})}selectedJan=key;state.last=`${managementCode} → ${locName(to)} ${qty}個`;save();tab('search')}
function moveStockHtml(jan,p){const src=locationOptionsForSource(p),dst=allDestLocations();return`<div class="card"><b>在庫移動</b><div class="row" style="margin-top:8px"><label class="muted">移動元</label><select id="moveFrom">${src.map(id=>`<option value="${id}">${locName(id)}</option>`).join('')}</select><label class="muted">移動先</label><select id="moveTo" onchange="updateMoveActionLabel()">${dst.map(id=>`<option value="${id}">${destLabel(id)}</option>`).join('')}</select><label class="muted">数量</label><div class="row" style="gap:10px"><button type="button" onclick="stepMoveQty(-1)">－</button><span id="moveQtyText" class="pill" style="min-width:58px;justify-content:center">1</span><button type="button" onclick="stepMoveQty(1)">＋</button><input id="moveQty" type="hidden" value="1"></div><button id="moveActionBtn" onclick="moveStock('${jan}')">移動</button></div><div id="moveRemoveNote" class="muted" style="display:none;margin-top:8px;color:var(--red)">この操作では在庫数だけが減ります。商品情報、写真、タグ、メモは削除されません。</div></div>`}
function moveStock(jan){const p=product(jan),from=document.getElementById('moveFrom')?.value,to=document.getElementById('moveTo')?.value,qty=positiveInt(document.getElementById('moveQty')?.value);if(!qty){alert('数量は1以上の整数で入力してください');return}if(!from||!to){alert('移動元と移動先を選択してください');return}if(from===to){alert('移動元と移動先が同じです');return}if(qty>qtyAt(p,from)){alert('移動元在庫を超える数量は移動できません');return}if(to==='remove_stock'){if(!confirm(`${locName(from)}の在庫を${qty}個減らします。\n\n減らした在庫は他の保管場所へ移動しません。\n商品情報は削除されません。\n\n実行しますか？`))return;snapshot('在庫削減取り消し '+(p.managementCode||jan));const before={...p.locations,boxes:{...p.locations.boxes}};removeQty(p,from,qty);const after={...p.locations,boxes:{...p.locations.boxes}};state.logs.push({type:'remove_stock',productId:p.productId,managementCode:p.managementCode,jan:p.jan||'',from,qty,before,after,timestamp:new Date().toISOString()});state.last=`${p.managementCode||jan} ${locName(from)}から在庫を${qty}個減らしました`;save();render();return}const nextWarehouse=p.locations.warehouse+(to==='warehouse'?qty:0)-(from==='warehouse'?qty:0);if(to==='warehouse'&&nextWarehouse>p.warehouseTarget&&!confirm(`${locName('warehouse')}目標数は${p.warehouseTarget}個です。\n\n移動すると${locName('warehouse')}在庫は${nextWarehouse}個になります。\n\nこのまま移動しますか？`))return;if(!confirm(`${locName(from)}から${locName(to)}へ\n${qty}個移動します。\n\n実行しますか？`))return;snapshot('在庫移動 '+(p.managementCode||jan));const before={...p.locations,boxes:{...p.locations.boxes}};removeQty(p,from,qty);addQty(p,to,qty);const after={...p.locations,boxes:{...p.locations.boxes}};state.logs.push({type:'move',productId:p.productId,managementCode:p.managementCode,jan:p.jan||'',from,to,qty,before,after,timestamp:new Date().toISOString()});state.last=`${p.managementCode||jan} ${locName(from)}→${locName(to)} ${qty}個`;save();render()}
function saveProductInfo(jan){const key=productKeyOf(jan),p=product(key),target=normalizeTarget(document.getElementById('pTarget')?.value),newJan=String(document.getElementById('pJan')?.value||'').replace(/\D/g,'');if(target===null){alert('目標数は0以上の整数で入力してください');return}if(newJan&&(![8,13].includes(newJan.length)||!janCheckDigitOk(newJan))){alert('JANはEAN-13またはEAN-8の正しい値を入力してください');return}if(duplicateJanExists(newJan,key)){alert('同じJANの商品が既にあります');return}snapshot('商品情報変更 '+(p.managementCode||key));p.name=document.getElementById('pName')?.value.trim()||'';p.jan=newJan;p.memo=document.getElementById('pMemo')?.value||'';p.warehouseTarget=target;rememberTags(p.tags);state.last='商品情報保存 '+(p.managementCode||key);save();render()}
function tagEditorHtml(jan){const p=product(jan),stats=tagStats();return`<div class="card"><b>タグ</b><div class="tagBox">${p.tags.map(t=>`<span class="tagChip on">${esc(t)} <button onclick="removeProductTag('${jan}','${jsq(t)}')">×</button></span>`).join('')||'<span class="muted">タグなし</span>'}</div><div class="tagBox">${stats.map(([t,n])=>`<button class="tagChip ${p.tags.includes(t)?'on':''}" onclick="toggleProductTag('${jan}','${jsq(t)}')">${esc(t)}（${n}）</button>`).join('')||'<span class="muted">タグ候補なし</span>'}</div><div class="row" style="margin-top:10px"><input id="newTag" placeholder="新規タグ追加"><button onclick="addProductTag('${jan}',document.getElementById('newTag').value)">追加</button></div></div>`}
function addProductTag(jan,val){const tag=String(val||'').trim();if(!tag)return;const p=product(jan);if(p.tags.includes(tag))return;snapshot('タグ追加 '+jan);p.tags=normalizeTags([...p.tags,tag]);rememberTags([tag]);save();render()}
function removeProductTag(jan,tag){const p=product(jan);if(!p.tags.includes(tag))return;snapshot('タグ削除 '+jan);p.tags=p.tags.filter(t=>t!==tag);save();render()}

function boxAddedAt(jan,boxId){const p=product(jan);return Date.parse(p.boxLastAddedAt?.[boxId]||'')||Date.parse((state.logs||[]).slice().reverse().find(l=>l.to===boxId&&productKeyOf(l.jan||l.productId||l.managementCode)===jan)?.timestamp||'')||Date.parse(p.createdAt||'')||0}
function sortBoxEntries(entries,boxId){return entries.sort((a,b)=>{let r=0;if(boxItemSort==='last_desc'||boxItemSort==='last_asc')r=boxAddedAt(a[0],boxId)-boxAddedAt(b[0],boxId);else if(boxItemSort==='name')r=(product(a[0]).name||a[0]).localeCompare(product(b[0]).name||b[0],'ja');else if(boxItemSort==='qty_desc'||boxItemSort==='qty_asc')r=a[1]-b[1];if(r===0)r=String(a[0]).localeCompare(String(b[0]));return(boxItemSort==='last_desc'||boxItemSort==='qty_desc')?-r:r})}
function boxFilteredEntries(boxId){return sortBoxEntries(Object.entries(boxContents(boxId)).filter(([jan])=>tagFilterMatch(jan)),boxId)}
function visibleBoxProductKeys(){const boxes=selectedBoxView==='all'?filteredBoxesForClass():selectedBoxView==='class'?[]:state.boxes.filter(b=>b.id===selectedBoxView),set=new Set();boxes.forEach(b=>boxFilteredEntries(b.id).forEach(([j])=>set.add(j)));return[...set]}

function boxClassKey(id){const c=boxClassOf(id);return c||'other'}

function boxClassesFromData(){const set=new Set();state.boxes.forEach(b=>set.add(boxClassKey(b.id)));return[...set].sort((a,b)=>a==='other'?1:b==='other'?-1:a.localeCompare(b))}

function boxClassPickerHtml(){const classes=boxClassesFromData();return`<div class="card"><div class="between"><div><b>箱を選択</b><div class="muted">箱コードの先頭文字で分類して表示します。</div></div><button class="primary" onclick="addBox()">＋箱追加</button></div><div class="classGrid">${classes.map(c=>`<button onclick="chooseBoxClass('${c}')">${esc(boxClassLabel(c))}</button>`).join('')}<button onclick="chooseBoxClass('__all')">すべて</button></div></div>`}
function renderBoxes(){const boxes=state.boxes.slice().sort((a,b)=>boxSort(a.id,b.id));if(selectedBoxView!=='class'&&selectedBoxView!=='all'&&!box(selectedBoxView))selectedBoxView='class';if(selectedBoxView==='class'){document.getElementById('boxes').innerHTML=`${boxClassPickerHtml()}${bulkBarHtml()}`;return}const shown=selectedBoxView==='all'?filteredBoxesForClass():boxes.filter(b=>b.id===selectedBoxView);document.getElementById('boxes').innerHTML=`<div class="card"><div class="between"><div><b>箱一覧</b><div class="muted">ホームの箱在庫と下部ナビの箱は同じ一覧です。箱とタグで絞り込めます。</div></div><div class="row"><button class="small" onclick="selectedBoxView='class';selectedBoxClass='';renderBoxes()">分類を選び直す</button><button class="primary" onclick="addBox()">＋箱追加</button>${bulkControlsHtml()}</div></div><div class="list"><div class="item between"><button class="${selectedBoxView==='all'?'primary':''}" onclick="selectedBoxView='all';renderBoxes()">${esc(boxClassLabel(selectedBoxClass||'__all'))}</button><span class="muted">${shown.length}箱</span></div>${shown.map(boxChoiceHtml).join('')}</div>${tagFilterHtml()}</div>${shown.length?shown.map(boxCardHtml).join(''):'<div class="card muted">箱はまだありません。</div>'}${bulkBarHtml()}`}
function boxChoiceHtml(b){const s=boxSummary(b);return`<div class="item between"><button class="${selectedBoxView===b.id?'primary':''}" onclick="selectedBoxView='${b.id}';renderBoxes()">${boxLabel(b.id)}</button><div class="muted">${b.status==='open'?'開いている':'完了'} / ${s.types}種類 / ${s.total}個</div></div>`}
function boxProductRowHtml(jan,n){const p=product(jan),on=multiSelectMode&&selectedProductIds.has(p.productId);return`<div class="item productCard ${on?'selected':''}" onclick="productClick('${jan}')"><div class="between"><div class="row" style="flex-wrap:nowrap;align-items:flex-start">${selectionMarkHtml(p)}<div class="boxPhotoSlot">${p.photoId?photoImgHtml(p.photoId,'boxMini'):'<div class="boxPhotoBlank"></div>'}</div><div><b>${esc(p.name||p.managementCode||jan)}</b><div class="mono muted">管理コード: ${esc(p.managementCode)}</div><div class="mono muted">${productDisplayJan(p)}</div>${tagChipsHtml(p.tags,4)}</div></div><b>${n}個</b></div></div>`}

function boxCardHtml(b){const entries=boxFilteredEntries(b.id),total=entries.reduce((s,e)=>s+e[1],0),single=selectedBoxView===b.id;return`<div class="card"><div class="between"><div><span class="pill">${boxLabel(b.id)}</span><div class="muted">${entries.length}種類 / ${total}個 / ${b.status==='open'?'開いている':'完了'}</div></div>${photoImgHtml(b.photoId,'mini')}</div>${single?boxSortSelectHtml():''}<div class="row" style="margin-top:8px"><button class="small" onclick="setBoxStatus('${b.id}','${b.status==='open'?'closed':'open'}')">${b.status==='open'?'完了':'再開'}</button><button class="small" onclick="renameBox('${b.id}')">名前変更</button><button class="small" onclick="takePhoto('box','${b.id}')">箱写真</button>${b.photoId?`<button class="small red" onclick="deletePhoto('box','${b.id}')">写真削除</button>`:''}<button class="small red" onclick="deleteBoxByInternalId('${jsq(b.boxId)}')">箱を削除</button></div>${entries.map(([jan,n])=>boxProductRowHtml(jan,n)).join('')||'<div class="muted" style="margin-top:8px">この条件の商品はありません。</div>'}</div>`}

function boxByInternalId(boxId){return state.boxes.find(b=>b.boxId===boxId)||null}
function boxInventoryCheck(boxId){const b=boxByInternalId(boxId);if(!b)return{ok:false,reason:'対象箱を特定できません。',box:null,total:0};let total=0;try{Object.values(state.products||{}).forEach(p=>{const boxes=p&&p.locations&&p.locations.boxes;if(!boxes||typeof boxes!=='object')return;if(Object.prototype.hasOwnProperty.call(boxes,b.id)){const n=Number(boxes[b.id]);if(!Number.isFinite(n)||n<0)throw new Error('箱在庫データに不整合があります。');total+=Math.max(0,Math.floor(n))}})}catch(e){return{ok:false,reason:e.message||'箱在庫データの確認に失敗しました。',box:b,total:0}}if(total>0)return{ok:false,reason:'この箱には商品が入っているため削除できません。\n中身をすべて別の場所へ移動してから削除してください。',box:b,total};return{ok:true,reason:'',box:b,total:0}}
function deleteBoxByInternalId(boxId){let c=boxInventoryCheck(boxId);if(!c.ok){alert(c.reason);return}const label=boxText(c.box.id);if(!confirm(`箱 ${label} を削除しますか？\n\nこの操作により、この箱の登録情報が削除されます。`))return;c=boxInventoryCheck(boxId);if(!c.ok){alert(c.reason);return}const before=historyData();try{snapshot('箱削除 '+c.box.id);const id=c.box.id;state.boxes=state.boxes.filter(b=>b.boxId!==boxId);Object.values(state.products||{}).forEach(p=>{if(p.locations?.boxes)delete p.locations.boxes[id];if(p.boxLastAddedAt)delete p.boxLastAddedAt[id]});if(scanDest===id)setScanDest('warehouse');if(selectedBoxView===id){selectedBoxView='class';selectedBoxClass=''}state.last=`箱削除 ${id}`;save();render();alert(`箱 ${label} を削除しました。`)}catch(e){try{restoreHistory({data:before})}catch(e2){}render();alert('箱削除に失敗しました。現在データは維持しました。\n'+(e.message||e))}}

async function handlePhotoFile(input){const f=input.files[0],targetInfo=photoTarget;photoTarget=null;if(!f||!targetInfo)return;const oldRaw=localStorage.getItem(APP_KEY),before=JSON.stringify(state);let savedState=false,newId='';try{let data=await resizeImage(f,1280,0.75);if(data.length>900000)data=await resizeImage(f,800,0.7);const target=targetInfo.type==='product'?product(targetInfo.id):box(targetInfo.id);if(!target)throw new Error('対象が見つかりません');const oldId=target.photoId||'',id=oldId||photoIdFor(targetInfo.type,targetInfo.id),now=new Date().toISOString();newId=id;snapshot('写真変更');target.photoId=id;delete target.photo;try{save()}catch(saveErr){if(!isQuotaError(saveErr))throw saveErr;state.undo.shift();state.redo=[];save()}savedState=true;await putPhotoRecord({id,type:targetInfo.type,ownerId:targetInfo.id,dataUrl:data,createdAt:oldId?undefined:now,updatedAt:now});input.value='';render()}catch(err){try{state=JSON.parse(before);if(savedState){if(oldRaw===null)localStorage.removeItem(APP_KEY);else localStorage.setItem(APP_KEY,oldRaw)}if(newId&&!oldRaw)await deletePhotoRecord(newId)}catch(e2){}input.value='';render();alert('写真保存失敗: '+(err.message||err))}}
document.getElementById('photoInput').addEventListener('change',e=>handlePhotoFile(e.target));document.getElementById('photoLibraryInput').addEventListener('change',e=>handlePhotoFile(e.target));
async function deletePhoto(type,id){const target=type==='product'?product(id):box(id);if(!target||!target.photoId)return;try{await deletePhotoRecord(target.photoId);snapshot('写真削除');target.photoId='';save();render()}catch(err){alert('写真削除失敗: '+(err.message||err))}}
function resizeImage(file,max,quality){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(Math.max(w,h)>max){const r=max/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r)}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',quality))};img.onerror=reject;img.src=URL.createObjectURL(file)})}

function renderData(){document.getElementById('data').innerHTML=`<div class="card"><b>完全バックアップ / 復元</b><div class="muted">V2.18の在庫・箱・ログ・写真を含む完全復元用です。旧V2形式も読み込めます。</div><div class="grid" style="margin-top:10px"><button class="primary" onclick="backupJson()">JSONバックアップ</button><button onclick="safeBackupRaw()">安全バックアップ</button><button onclick="backupWithPhotos()">写真込みバックアップ</button><button onclick="document.getElementById('restoreFile').click()">JSON復元</button><button onclick="downloadProductCsv()">商品別CSV</button></div><input id="restoreFile" type="file" accept="application/json,.json" style="display:none" onchange="restoreJson(event)"></div><div class="card"><b>商品マスター</b><div class="muted">商品ID・管理コード・JAN・商品名・写真・タグ・メモ・倉庫目標数のみ。在庫数は含みません。</div><div class="grid" style="margin-top:10px"><button onclick="exportProductMaster()">商品マスターを書き出す</button><button onclick="document.getElementById('masterRestoreFile').click()">商品マスターを復元</button></div><input id="masterRestoreFile" type="file" accept="application/json,.json" style="display:none" onchange="restoreProductMaster(event)"></div><div class="card"><b>設定</b><div class="muted">保管場所名設定</div><label>${esc(locName('warehouse'))}</label><input id="warehouseName" value="${esc(state.locations.warehouseName)}"><label>${esc(locName('staging'))}</label><input id="stagingName" value="${esc(state.locations.stagingName)}"><button onclick="saveLocationNames()">保管場所名を保存</button><div class="filterBox"><label class="muted"><input type="checkbox" id="rememberScanDest" ${state.settings.rememberScanDest?'checked':''}> 前回の入庫先を記憶する</label><button onclick="saveScanSettings()">スキャン設定を保存</button></div></div>${bulkWarehouseTargetHtml()}<div class="card"><b>箱分類設定</b>${LETTERS.map(c=>`<div class="row"><span class="mono">${c}</span><input id="class_${c}" value="${esc(state.boxClasses[c].name||'')}" placeholder="分類${c}"><label class="muted"><input type="checkbox" id="classOn_${c}" ${state.boxClasses[c].enabled?'checked':''}> 有効</label></div>`).join('')}<button onclick="saveClassSettings()">箱分類を保存</button></div><div class="card dangerZone"><b>危険操作</b><button class="red" onclick="resetAll()">全データ削除</button></div>`}
function applyBulkWarehouseTarget(){const target=normalizeTarget(document.getElementById('bulkTarget')?.value),keys=Object.keys(state.products||{}).filter(k=>state.products[k]&&state.products[k].productId);if(target===null||target>99999){alert('目標数は0以上の整数で入力してください');return}if(!confirm(`登録されている${keys.length}件すべての商品の\n${locName('warehouse')}目標数を${target}に変更します。\n\n商品ごとに設定されている現在の目標数は上書きされます。`))return;const before=historyData();try{snapshot('倉庫目標数一括設定');keys.forEach(k=>{state.products[k].warehouseTarget=target});state.last=`倉庫目標数一括設定 ${keys.length}件 → ${target}`;save();render();alert(`${keys.length}件すべての商品の${locName('warehouse')}目標数を${target}に変更しました。`)}catch(e){try{restoreHistory({data:before})}catch(e2){}render();alert('一括設定に失敗しました。現在データは維持しました。\n'+(e.message||e))}}
function saveLocationNames(){snapshot('保管場所名変更');state.locations.warehouseName=document.getElementById('warehouseName').value.trim()||'倉庫';state.locations.stagingName=document.getElementById('stagingName').value.trim()||'仮置き場';save();render()}
function saveScanSettings(){snapshot('スキャン設定変更');state.settings.rememberScanDest=!!document.getElementById('rememberScanDest')?.checked;if(!state.settings.rememberScanDest){localStorage.removeItem(SCAN_DEST_KEY);setScanDest('warehouse',false)}else localStorage.setItem(SCAN_DEST_KEY,scanDestExists(scanDest)?scanDest:'warehouse');save();render()}
function saveClassSettings(){snapshot('箱分類設定変更');LETTERS.forEach(c=>{state.boxClasses[c].name=document.getElementById('class_'+c).value.trim();state.boxClasses[c].enabled=document.getElementById('classOn_'+c).checked});save();render()}
function sanitizeStateForStorage(src){const prev=state;const next={...emptyState(),...JSON.parse(JSON.stringify(src||{}))};next.undo=[];next.redo=[];Object.values(next.products||{}).forEach(p=>{delete p.photo;p.tags=normalizeTags(p.tags)});(next.boxes||[]).forEach(b=>{delete b.photo});state=next;migrate();const out=JSON.parse(JSON.stringify(state));state=prev;return out}
function cloneStateForBackup(){return sanitizeStateForStorage(state)}
async function backupJson(){try{await saveBackupFile('BM001_v2_backup_'+stamp()+'.json',JSON.stringify(cloneStateForBackup(),null,2),'application/json')}catch(err){alert('バックアップ失敗: '+(err.message||err))}}
async function safeBackupRaw(){try{const raw=localStorage.getItem(APP_KEY)||JSON.stringify(state);await saveBackupFile('BM001_v2_safe_'+stamp()+'.json',raw,'application/json')}catch(err){alert('安全バックアップ失敗: '+(err.message||err))}}
async function backupWithPhotos(){try{const photos=await getAllPhotoRecords();const payload={bm001Version:'V2.18',state:cloneStateForBackup(),photos};const json=JSON.stringify(payload,null,2);if(!confirm(`写真込みバックアップを作成します。\n\n写真: ${photos.length}枚\n推定サイズ: ${Math.ceil(new Blob([json]).size/1024)} KB`))return;await saveBackupFile('BM001_v2_full_'+stamp()+'.json',json,'application/json')}catch(err){alert('写真込みバックアップ失敗: '+(err.message||err))}}
function normalizeRestorePayload(raw){const parsed=JSON.parse(raw);if(parsed&&parsed.state&&isV2State(parsed.state))return{state:parsed.state,photos:parsed.photos||[]};if(isV2State(parsed))return{state:parsed,photos:[]};throw new Error('V2形式ではありません。V1形式は商品情報のみ移行できます。')}
async function restoreJson(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{localStorage.removeItem(RESTORE_TEST_KEY);const payload=normalizeRestorePayload(String(r.result||''));const rawSize=new Blob([JSON.stringify(payload.state)]).size;const next=sanitizeStateForStorage(payload.state);const json=JSON.stringify(next);const cleanSize=new Blob([json]).size;if(!confirm(`V2完全復元を実行します。\n\n商品: ${Object.keys(next.products||{}).length}\n箱: ${(next.boxes||[]).length}\n写真: ${(payload.photos||[]).length}枚\n\n復元前サイズ: ${Math.ceil(rawSize/1024)} KB\n復元後サイズ: ${Math.ceil(cleanSize/1024)} KB\n\n容量対策のため、旧写真Base64とUndo/Redo履歴は復元しません。`)){e.target.value='';return}localStorage.setItem(RESTORE_TEST_KEY,json);if(localStorage.getItem(RESTORE_TEST_KEY)!==json)throw new Error('保存テストに失敗しました');localStorage.removeItem(RESTORE_TEST_KEY);for(const p of payload.photos||[])await putPhotoRecord(p);localStorage.setItem(APP_KEY,json);state=next;photoCache={};render();alert('復元しました')}catch(err){try{localStorage.removeItem(RESTORE_TEST_KEY)}catch(e2){}alert('復元失敗: '+(err.message||err))}finally{e.target.value=''}};r.readAsText(f)}
function productMasterProduct(key,p){return{productId:p.productId,managementCode:p.managementCode,jan:p.jan||'',name:p.name||'',memo:p.memo||'',tags:normalizeTags(p.tags),photoId:p.photoId||'',createdAt:p.createdAt||'',warehouseTarget:p.warehouseTarget}}
async function buildProductMasterPayload(){const products=Object.keys(state.products).sort().map(j=>productMasterProduct(j,state.products[j]));const ids=[...new Set(products.map(p=>p.photoId).filter(Boolean))];const photos=[];for(const id of ids){const rec=await getPhotoRecord(id);if(rec&&rec.dataUrl)photos.push({...rec,type:'product'})}return{type:'BM001_PRODUCT_MASTER',version:'V2.18',exportedAt:new Date().toISOString(),products,photos}}
async function exportProductMaster(){try{const payload=await buildProductMasterPayload(),json=JSON.stringify(payload,null,2);if(!confirm(`商品マスターを書き出します。\n\n商品: ${payload.products.length}\n写真: ${payload.photos.length}枚\n推定サイズ: ${Math.ceil(new Blob([json]).size/1024)} KB\n\n在庫・箱・ログは含みません。`))return;await saveBackupFile('BM001_product_master_'+stamp()+'.json',json,'application/json')}catch(err){alert('商品マスター書き出し失敗: '+(err.message||err))}}
function validateProductMaster(raw){const src=JSON.parse(raw);if(!src||src.type!=='BM001_PRODUCT_MASTER')throw new Error('商品マスター形式ではありません');const arr=Array.isArray(src.products)?src.products:Object.keys(src.products||{}).map(j=>({...src.products[j],jan:src.products[j].jan??j}));const products={};arr.forEach((p,i)=>{const jan=String(p.jan||'').replace(/\D/g,''),productId=p.productId||generateId('prod'),key=productId||jan||generateId('prod');if(jan&&(![8,13].includes(jan.length)||!janCheckDigitOk(jan)))throw new Error('不正なJANがあります');products[key]=normalizeProduct({productId,managementCode:p.managementCode||'',jan,name:p.name||'',memo:p.memo||'',tags:normalizeTags(p.tags),photoId:p.photoId||'',createdAt:p.createdAt||'',warehouseTarget:normalizeTarget(p.warehouseTarget??p.aTarget)??3,locations:{warehouse:0,staging:0,boxes:{}}},key)});const photos=Array.isArray(src.photos)?src.photos.filter(p=>p&&p.id&&p.dataUrl&&(!p.type||p.type==='product')):[];return{products,photos}}
async function restoreProductMaster(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const master=validateProductMaster(String(r.result||''));if(!confirm(`商品マスターを復元します。\n\n商品数: ${Object.keys(master.products).length}\n写真: ${master.photos.length}枚\n\n在庫数・箱・ログは復元しません。\n復元後は全商品の在庫が0になります。`)){e.target.value='';return}const next=emptyState();next.products=master.products;next.tags=normalizeTags(Object.values(master.products).flatMap(p=>p.tags));const json=JSON.stringify(next);localStorage.setItem(MASTER_RESTORE_TEST_KEY,json);if(localStorage.getItem(MASTER_RESTORE_TEST_KEY)!==json)throw new Error('保存テストに失敗しました');for(const p of master.photos)await putPhotoRecord({...p,type:'product'});state=next;save();localStorage.removeItem(MASTER_RESTORE_TEST_KEY);photoCache={};render();alert('商品マスターを復元しました。全商品の在庫は0です。')}catch(err){alert('商品マスター復元失敗: '+(err.message||err))}finally{e.target.value=''}};r.readAsText(f)}
async function saveBackupFile(name,content,type){try{if(typeof File==='function'&&navigator.share&&navigator.canShare){const file=new File([content],name,{type:type+';charset=utf-8'});if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}}}catch(e){if(e&&e.name==='AbortError')return}downloadRaw(name,content,type)}
function downloadRaw(name,content,type){const blob=new Blob([content],{type:type+';charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function stamp(){const d=new Date();return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'_'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')}
function csvEscape(v){v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function downloadProductCsv(){const rows=[[ '商品ID','管理コード','JAN','商品名',locName('warehouse')+'在庫',locName('staging')+'在庫','箱合計','総在庫','倉庫目標数','タグ','メモ','箱内訳' ]];Object.keys(state.products).sort().forEach(j=>{const p=product(j);rows.push([p.productId,p.managementCode,p.jan||'',p.name,p.locations.warehouse,p.locations.staging,boxTotal(p),totalOf(p),p.warehouseTarget,tagsText(p),p.memo,Object.entries(p.locations.boxes).sort((a,b)=>boxSort(a[0],b[0])).map(([b,n])=>`${b}:${n}`).join('|')])});downloadRaw('BM001_products_'+stamp()+'.csv','\ufeff'+rows.map(r=>r.map(csvEscape).join(',')).join('\n'),'text/csv')}
function resetAll(){if(!confirm('全データを削除します。よろしいですか？'))return;if(!confirm('この操作は元に戻せません。続行しますか？'))return;state=emptyState();save();render()}
function showWhatsNew(){alert('BM-001 V2.18\n\n・空の箱を削除可能にしました\n・スキャン成功時にJANと追加先を短時間表示し、認識音を鳴らします\n・前回読み取り成功したカメラと近距離フォーカスを優先します\n・箱一覧を分類選択から開けるようにしました\n・個別箱の商品一覧に並び替えを追加しました\n・全商品の倉庫目標数を一括設定できます')}
let photoScrollTimer=null;addEventListener('scroll',()=>{clearTimeout(photoScrollTimer);photoScrollTimer=setTimeout(loadVisiblePhotos,80)},{passive:true});
addEventListener('beforeunload',e=>{if(hasPendingBox()){e.preventDefault();e.returnValue='箱が選択されていません'}});
load();render();updateFab();
</script>
</body>
