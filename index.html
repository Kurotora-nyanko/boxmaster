<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>BoxMaster BM-001 V1.16</title>
<script src="https://unpkg.com/@zxing/browser@latest"></script>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#111;--muted:#667085;--line:#d7dbe2;--blue:#1455d9;--green:#147a3d;--red:#b42318;--amber:#b76e00}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:20;background:#111;color:#fff;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));box-shadow:0 2px 8px #0002}header h1{margin:0;font-size:17px}.sub{font-size:12px;opacity:.78;margin-top:2px}main{max-width:860px;margin:auto;padding:10px 10px 92px}.view{display:none}.view.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;margin:10px 0;box-shadow:0 1px 3px #00000010}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{display:flex;align-items:center;justify-content:space-between;gap:8px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:#fafafa;border:1px solid var(--line);border-radius:14px;padding:12px}.stat .n{font-size:25px;font-weight:800}.stat .l{font-size:12px;color:var(--muted)}button,input,textarea,select{font-size:16px;border-radius:12px;border:1px solid #b8bec8;background:#fff;padding:11px 12px}button{font-weight:750;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button.primary{background:#111;color:#fff;border-color:#111}button.blue{background:var(--blue);color:#fff;border-color:var(--blue)}button.green{background:var(--green);color:#fff;border-color:var(--green)}button.red{background:var(--red);color:#fff;border-color:var(--red)}button.amber{background:var(--amber);color:#fff;border-color:var(--amber)}button.small{font-size:13px;padding:7px 9px;border-radius:10px}button.full{width:100%}input,textarea,select{width:100%}textarea{min-height:72px}.muted{color:var(--muted);font-size:13px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid #b8bec8;border-radius:999px;padding:8px 10px;background:#fff;font-weight:750}.pill.closed{opacity:.55;text-decoration:line-through}.notice{border-radius:16px;padding:14px;color:#fff}.notice.a{background:var(--green)}.notice.b{background:var(--blue)}.notice.err{background:var(--red)}.big{font-size:28px;font-weight:850}.boxbtn{min-width:82px}.thumb{width:100%;max-height:260px;object-fit:contain;background:#eee;border-radius:14px;border:1px solid var(--line)}.mini{width:72px;height:72px;object-fit:cover;border-radius:12px;border:1px solid var(--line);background:#eee}.list{border-top:1px solid var(--line);margin-top:8px}.item{padding:10px 0;border-bottom:1px solid var(--line)}.editgrid{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:start}.dangerZone{border-color:#f1b8b3;background:#fff8f7}#videoWrap{display:none;background:#000;border-radius:16px;overflow:hidden;position:relative}video{width:100%;display:block;max-height:48vh;object-fit:cover}.scanFrame{position:absolute;left:50%;top:50%;width:min(78vw,360px);height:min(78vw,360px);max-height:72%;transform:translate(-50%,-50%);border:3px solid #fffc;border-radius:20px;box-shadow:0 0 0 999px #0003;pointer-events:none}.scanLabel{position:absolute;top:10px;left:10px;background:#000a;color:#fff;padding:6px 9px;border-radius:999px;font-size:12px}.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:#cfd4dc;padding-bottom:env(safe-area-inset-bottom)}.tabs button{border:0;border-radius:0;background:#fff;font-size:12px;padding:11px 2px}.tabs button.active{background:#111;color:#fff}.fabScan{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:45;width:76px;height:76px;border-radius:999px;background:#111;color:#fff;border:2px solid #fff;box-shadow:0 8px 22px #0005;font-size:30px;display:none;align-items:center;justify-content:center;padding:0}.fabScan.show{display:flex}@media(min-width:720px){.stats{grid-template-columns:repeat(5,1fr)}.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header><h1>BoxMaster BM-001</h1><div class="sub">V1.16 / JAN整理・3個残し・箱別数量管理</div></header>
<main>
<section id="home" class="view active"></section>
<section id="scan" class="view"></section>
<section id="alist" class="view"></section>
<section id="search" class="view"></section>
<section id="boxes" class="view"></section>
<section id="data" class="view"></section>
</main>
<nav class="tabs">
<button data-tab="home" class="active">ホーム</button><button data-tab="scan">スキャン</button><button data-tab="search">検索</button><button data-tab="boxes">箱</button><button data-tab="data">データ</button>
</nav>
<button id="fabScan" class="fabScan" onclick="quickStartScan()" aria-label="スキャン開始">+</button>
<input id="photoInput" type="file" accept="image/*" capture="environment" style="display:none">
<script>
const APP_KEY='BM001_V100_DATA';
const PHOTO_DB_NAME='BM001_PHOTO_DB';
const PHOTO_STORE_NAME='photos';
const RESTORE_TEST_KEY='BM001_RESTORE_TEST';
const A_SORT_KEY='BM001_A_SORT';
const CAMERA_KEY='BM001_CAMERA_DEVICE_ID';
const ZOOM_KEY='BM001_CAMERA_ZOOM';
const ORIENTATION_SCAN_INTERVAL_MS=400;
let state={products:{},boxes:[{id:'B001',status:'open'}],logs:[],undo:[],redo:[],last:null};
let currentTab='home',scanner=null,scanMode='scan',selectedJan=null,pendingBoxJan='',photoTarget=null;
let scanLocked=false,lastScanCode='',lastScanAt=0,historyBusy=false;
let cameraDevices=[],selectedDeviceId=localStorage.getItem(CAMERA_KEY)||'',currentCameraLabel='自動（背面優先）',zoomOptions=[],selectedZoom=parseFloat(localStorage.getItem(ZOOM_KEY)||'1')||1,currentTrack=null;
let aSortMode=localStorage.getItem(A_SORT_KEY)||'last';
let frameScanTimer=null,frameScanBusy=false,frameReader=null;
let pendingRestore=null,photoDbPromise=null,photoCache={};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function load(){try{const s=localStorage.getItem(APP_KEY);if(s)state=JSON.parse(s)}catch(e){alert('保存データ読込に失敗しました。データは削除せず保持しています。データ画面の安全バックアップでraw JSONを保存してください。')}migrate()}
function migrate(){if(!state.products)state.products={};Object.keys(state.products).forEach(j=>{const p=state.products[j];if(p&&!('photoId'in p)&&p.photoId!==null)p.photoId=p.photoId||''});if(!Array.isArray(state.boxes)||!state.boxes.length)state.boxes=[{id:'B001',status:'open',photoId:'',name:''}];state.boxes.forEach(b=>{if(!('name'in b))b.name='';if(!('photoId'in b))b.photoId=b.photoId||'';if(!b.status)b.status='open'});if(!Array.isArray(state.logs))state.logs=[];if(!Array.isArray(state.undo))state.undo=[];if(!Array.isArray(state.redo))state.redo=[]}
function save(){migrate();localStorage.setItem(APP_KEY,JSON.stringify(state))}
function historyData(){return JSON.stringify({products:state.products,boxes:state.boxes,logs:state.logs,last:state.last})}
function snapshot(label){state.undo.unshift({label,at:new Date().toISOString(),data:historyData()});state.undo=state.undo.slice(0,50);state.redo=[]}
function restoreHistory(h){const d=JSON.parse(h.data);state.products=d.products;state.boxes=d.boxes;state.logs=d.logs;state.last=d.last;migrate()}
function undo(){if(historyBusy)return;historyBusy=true;render();try{const u=state.undo.shift();if(!u){alert('取り消す操作がありません');return}state.redo.unshift({label:u.label,at:new Date().toISOString(),data:historyData()});state.redo=state.redo.slice(0,50);restoreHistory(u);save();alert('取り消しました: '+u.label)}finally{historyBusy=false;render()}}
function redo(){if(historyBusy)return;historyBusy=true;render();try{const r=state.redo.shift();if(!r){alert('やり直す操作がありません');return}state.undo.unshift({label:r.label,at:new Date().toISOString(),data:historyData()});state.undo=state.undo.slice(0,50);restoreHistory(r);save();alert('やり直しました: '+r.label)}finally{historyBusy=false;render()}}
function undoRedoButtons(cls=''){return `<div class="row"><button class="${cls} amber" onclick="undo()" ${historyBusy||!state.undo.length?'disabled':''}>取り消し</button><button class="${cls}" onclick="redo()" ${historyBusy||!state.redo.length?'disabled':''}>やり直し</button></div>`}
function product(jan){if(!state.products[jan])state.products[jan]={jan,name:'',memo:'',photoId:''};return state.products[jan]}
function openBoxes(){return state.boxes.filter(b=>b.status==='open')}
function box(id){return state.boxes.find(b=>b.id===id)}
function boxName(id){const b=box(id);return b&&b.name?b.name:''}
function boxLabel(id){const n=boxName(id);return n?`${esc(n)}（${esc(id)}）`:esc(id)}
function boxText(id){const n=boxName(id);return n?`${n}（${id}）`:id}
function nextBoxId(){let max=0;state.boxes.forEach(b=>{const m=String(b.id).match(/^B(\d+)$/);if(m)max=Math.max(max,parseInt(m[1]))});return 'B'+String(max+1).padStart(3,'0')}
function scanLogs(){return state.logs.filter(l=>l&&l.jan&&(l.action==='A'||l.action==='B'))}
function countsByJan(jan){const res={total:0,a:0,b:0,boxes:{}};scanLogs().forEach(l=>{if(l.jan!==jan)return;res.total++;if(l.action==='A')res.a++;else if(l.box){res.b++;res.boxes[l.box]=(res.boxes[l.box]||0)+1}});return res}
function boxContents(boxId){const m={};scanLogs().forEach(l=>{if(l.action==='B'&&l.box===boxId)m[l.jan]=(m[l.jan]||0)+1});return m}
function stats(){const logs=scanLogs();const jans=new Set(logs.map(l=>l.jan));let a=0,b=0;logs.forEach(l=>l.action==='A'?a++:b++);return{types:jans.size,total:logs.length,a,b,open:openBoxes().length,closed:state.boxes.filter(x=>x.status==='closed').length}}
function nameOf(jan){const p=state.products[jan];return p&&p.name?p.name:jan}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function formId(prefix,jan){return prefix+'_'+String(jan).replace(/[^a-zA-Z0-9_-]/g,'_')}
function openPhotoDb(){if(photoDbPromise)return photoDbPromise;photoDbPromise=new Promise((resolve,reject)=>{const req=indexedDB.open(PHOTO_DB_NAME,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(PHOTO_STORE_NAME))db.createObjectStore(PHOTO_STORE_NAME,{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});return photoDbPromise}
async function photoStore(mode,fn){const db=await openPhotoDb();return new Promise((resolve,reject)=>{const tx=db.transaction(PHOTO_STORE_NAME,mode);const st=tx.objectStore(PHOTO_STORE_NAME);let out;try{out=fn(st)}catch(e){reject(e);return}tx.oncomplete=()=>resolve(out);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}
async function putPhotoRecord(rec){await photoStore('readwrite',st=>st.put(rec));photoCache[rec.id]=rec.dataUrl}
async function getPhotoRecord(id){if(!id)return null;return await new Promise(async(resolve,reject)=>{try{const db=await openPhotoDb();const tx=db.transaction(PHOTO_STORE_NAME,'readonly');const req=tx.objectStore(PHOTO_STORE_NAME).get(id);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error)}catch(e){reject(e)}})}
async function deletePhotoRecord(id){if(!id)return;await photoStore('readwrite',st=>st.delete(id));delete photoCache[id]}
async function getAllPhotoRecords(){return await new Promise(async(resolve,reject)=>{try{const db=await openPhotoDb();const tx=db.transaction(PHOTO_STORE_NAME,'readonly');const req=tx.objectStore(PHOTO_STORE_NAME).getAll();req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error)}catch(e){reject(e)}})}
function photoIdFor(type,ownerId){return `${type}_${String(ownerId).replace(/[^a-zA-Z0-9_-]/g,'_')}_${uid()}`}
function photoImgHtml(photoId,cls='mini'){return photoId?`<img class="${cls}" data-photo-id="${esc(photoId)}" alt="写真読込中">`:''}
function photoPlaceholderHtml(photoId){return photoId?'<div class="muted">写真読込中</div>':''}
async function loadVisiblePhotos(){const imgs=[...document.querySelectorAll('img[data-photo-id]')];for(const img of imgs){const id=img.dataset.photoId;if(!id)continue;try{if(!photoCache[id]){const rec=await getPhotoRecord(id);if(rec&&rec.dataUrl)photoCache[id]=rec.dataUrl}if(photoCache[id])img.src=photoCache[id];else img.style.display='none'}catch(e){img.style.display='none'}}}
async function migrateLegacyPhotos(){let moved=0,changed=false;try{for(const jan of Object.keys(state.products||{})){const p=state.products[jan];if(p&&p.photo&&String(p.photo).startsWith('data:image/')){const id=p.photoId||photoIdFor('product',jan);await putPhotoRecord({id,type:'product',ownerId:jan,dataUrl:p.photo,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});p.photoId=id;delete p.photo;moved++;changed=true}}for(const b of state.boxes||[]){if(b&&b.photo&&String(b.photo).startsWith('data:image/')){const id=b.photoId||photoIdFor('box',b.id);await putPhotoRecord({id,type:'box',ownerId:b.id,dataUrl:b.photo,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});b.photoId=id;delete b.photo;moved++;changed=true}}if(changed){save();render();alert('写真をIndexedDBへ移行しました: '+moved+'枚')}}catch(e){alert('写真移行に失敗しました。元データは削除していません: '+(e.message||e))}}
function tab(id){currentTab=id;document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id));document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));stopScan();render();updateFab()}
function updateFab(){const f=document.getElementById('fabScan');if(f)f.classList.toggle('show',currentTab==='scan')}
function quickStartScan(){if(currentTab!=='scan'){tab('scan');setTimeout(()=>startScan('scan'),80)}else startScan('scan')}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
function render(){renderHome();renderScan();renderAList();renderSearch();renderBoxes();renderData();setTimeout(loadVisiblePhotos,0)}
function renderHome(){const s=stats();document.getElementById('home').innerHTML=`<div class="card"><div class="between"><div><b>ホーム</b><div class="muted">現在の進捗</div></div><button class="small" onclick="showWhatsNew()">V1.16</button></div><div class="stats" style="margin-top:10px"><div class="stat"><div class="n">${s.types}</div><div class="l">商品種類</div></div><div class="stat"><div class="n">${s.total}</div><div class="l">総スキャン数</div></div><div class="stat"><div class="n">${s.a}</div><div class="l">A保管</div></div><div class="stat"><div class="n">${s.b}</div><div class="l">B保管</div></div><div class="stat"><div class="n">${s.open}/${s.closed}</div><div class="l">開箱/完了箱</div></div></div></div><div class="grid"><button class="primary" onclick="tab('scan')">スキャン</button><button onclick="tab('alist')">A一覧</button><button onclick="tab('search')">検索</button><button onclick="tab('boxes')">箱一覧</button><button onclick="tab('data')">バックアップ</button></div>${state.last?`<div class="card"><div class="between"><div><b>最後の操作</b><div class="muted mono">${esc(state.last)}</div></div>${undoRedoButtons()}</div></div>`:''}`}
function renderScan(){const open=openBoxes();document.getElementById('scan').innerHTML=`<div class="card"><div class="between"><div><b>スキャン</b><div class="muted">JANを読む。4個目以降は箱を選択。</div></div>${undoRedoButtons('small')}</div><div class="muted" style="margin-top:8px">現在のカメラ: <span id="cameraName">${esc(currentCameraLabel)}</span></div><div class="muted">向き補正ON</div><div class="muted">近距離でピントが合わない場合はカメラ切替または少し離してください。</div><div id="videoWrap" style="margin-top:10px"><video id="video" playsinline></video><div class="scanFrame"></div><div class="scanLabel">JAN読取中</div></div><div class="row" style="margin-top:10px"><button class="primary" onclick="startScan('scan')">カメラで読む</button><button onclick="switchCamera()">カメラ切替</button><button onclick="stopScan()">停止</button></div><div id="zoomControls">${zoomControlsHtml()}</div><div class="row" style="margin-top:10px"><input id="manualJan" inputmode="numeric" placeholder="手入力JAN"><button onclick="manualScan()">登録</button></div></div><div class="card"><b>開いている箱</b><div class="row" style="margin-top:8px">${open.map(b=>`<span class="pill">${boxLabel(b.id)}</span>`).join('')||'<span class="muted">開いている箱がありません</span>'}<button class="small" onclick="addBox()">＋箱追加</button></div></div><div id="scanResult">${scanResultHtml()}</div>`}
function scanResultHtml(){if(!selectedJan)return'';const c=countsByJan(selectedJan);if(pendingBoxJan===selectedJan){const lastBox=lastBoxFor(selectedJan);return`<div class="notice b"><div class="big">箱を選択</div><div>${esc(nameOf(selectedJan))}</div><div class="mono">${selectedJan}</div><div>累計 ${c.total+1} 個目として登録します</div><div class="muted" style="color:#fff;opacity:.85">箱を選ぶまでは、この1個は未登録です。</div></div><div class="card"><div class="row">${lastBox&&box(lastBox)?.status==='open'?`<button class="blue boxbtn" onclick="putInBox('${selectedJan}','${lastBox}')">前回 ${boxText(lastBox)}</button>`:''}${openBoxes().map(b=>`<button class="boxbtn" onclick="putInBox('${selectedJan}','${b.id}')">${boxLabel(b.id)}</button>`).join('')}<button onclick="addBox();render()">＋箱追加</button></div></div>`}const last=lastLogFor(selectedJan);if(last&&last.action==='B')return`<div class="notice b"><div class="big">${boxLabel(last.box)}へ登録</div><div>${esc(nameOf(selectedJan))}</div><div class="mono">${selectedJan}</div><div>累計 ${c.total} 個 / B ${c.b} 個</div><div style="margin-top:10px"><button onclick="changeLastBox('${selectedJan}')">別の箱に変更</button></div></div>`;return`<div class="notice a"><div class="big">Aに残す</div><div>${esc(nameOf(selectedJan))}</div><div class="mono">${selectedJan}</div><div>累計 ${c.total} 個 / A ${c.a} 個</div></div>`}
function lastBoxFor(jan){for(let i=state.logs.length-1;i>=0;i--){const l=state.logs[i];if(l.jan===jan&&l.action==='B')return l.box}return''}
function lastLogFor(jan){for(let i=state.logs.length-1;i>=0;i--){const l=state.logs[i];if(l.jan===jan&&(l.action==='A'||l.action==='B'))return l}return null}
function manualScan(){const el=document.getElementById('manualJan');const v=el.value.trim();if(v)handleCode(v);el.value=''}
function handleCode(raw){const jan=String(raw).replace(/\D/g,'');if(!jan)return;const c=countsByJan(jan);product(jan);selectedJan=jan;if(c.total<3){pendingBoxJan='';snapshot('スキャン取り消し '+jan);state.logs.push({id:uid(),jan,action:'A'});state.last=`${jan} → A`;save();vibrate([50]);render();return}const lastBox=lastBoxFor(jan);if(lastBox&&box(lastBox)?.status==='open'){pendingBoxJan='';snapshot('箱自動登録取り消し '+jan+' → '+lastBox);state.logs.push({id:uid(),jan,action:'B',box:lastBox});state.last=`${jan} → ${boxText(lastBox)}`;save();vibrate([80]);render();return}pendingBoxJan=jan;render();vibrate([30,40,30])}
function putInBox(jan,boxId){snapshot('箱登録取り消し '+jan+' → '+boxId);state.logs.push({id:uid(),jan,action:'B',box:boxId});state.last=`${jan} → ${boxText(boxId)}`;selectedJan=jan;pendingBoxJan='';save();vibrate([80]);render()}
function changeLastBox(jan){const l=lastLogFor(jan);if(!l||l.action!=='B')return;const choices=openBoxes().map(b=>b.id).filter(id=>id!==l.box);if(!choices.length){alert('他に開いている箱がありません。先に箱を追加してください。');return}const to=prompt('移動先の箱番号を入力してください\n候補: '+choices.join(', '),choices[0]);if(!to)return;if(!box(to)){alert('その箱はありません');return}snapshot('直前箱変更 '+jan);l.box=to;state.last=`${jan} ${boxText(to)}へ変更`;save();render()}
function lastLogIndex(jan){for(let i=state.logs.length-1;i>=0;i--){if(state.logs[i].jan===jan)return i}return-1}
function sortAItems(rows){const mode=aSortMode||'last';return rows.sort((a,b)=>{const pa=product(a),pb=product(b),na=(pa.name||''),nb=(pb.name||''),ha=pa.photoId?1:0,hb=pb.photoId?1:0;if(mode==='jan')return a.localeCompare(b);if(mode==='name')return nameOf(a).localeCompare(nameOf(b),'ja')||a.localeCompare(b);if(mode==='photo')return hb-ha||lastLogIndex(b)-lastLogIndex(a)||a.localeCompare(b);if(mode==='nophoto')return ha-hb||lastLogIndex(b)-lastLogIndex(a)||a.localeCompare(b);if(mode==='noname')return (na?1:0)-(nb?1:0)||lastLogIndex(b)-lastLogIndex(a)||a.localeCompare(b);return lastLogIndex(b)-lastLogIndex(a)||a.localeCompare(b)})}
function setASort(v){aSortMode=v||'last';localStorage.setItem(A_SORT_KEY,aSortMode);renderAList()}
function aSortSelectHtml(){const opts=[['last','最終スキャン順'],['jan','JAN順'],['name','商品名順'],['photo','写真あり優先'],['nophoto','写真なし優先'],['noname','商品名なし優先']];return`<select id="aSort" onchange="setASort(this.value)">${opts.map(([v,t])=>`<option value="${v}" ${aSortMode===v?'selected':''}>${t}</option>`).join('')}</select>`}
function renderAList(){const rows=sortAItems(Object.keys(state.products).filter(j=>countsByJan(j).a>0));document.getElementById('alist').innerHTML=`<div class="card"><div class="between"><div><b>A一覧</b><div class="muted">Aに残す商品。商品名・写真・メモを編集できます。</div></div><button class="small" onclick="tab('home')">ホーム</button></div><div class="row" style="margin-top:10px"><span class="muted">並び替え</span>${aSortSelectHtml()}</div></div>${rows.map(aItemHtml).join('')||'<div class="card muted">A保管の商品はまだありません。</div>'}`}
function aItemHtml(jan){const p=product(jan),c=countsByJan(jan),n=formId('aName',jan),m=formId('aMemo',jan);return`<div class="card"><div class="editgrid"><div>${p.photoId?photoImgHtml(p.photoId,'mini'):'<div class="mini"></div>'}</div><div><div class="between"><div><b>${esc(nameOf(jan))}</b><div class="mono muted">${jan}</div></div><span class="pill">A ${c.a} / 総 ${c.total}</span></div><label class="muted">商品名</label><input id="${n}" value="${esc(p.name)}" placeholder="商品名"><label class="muted">メモ</label><textarea id="${m}">${esc(p.memo)}</textarea><div class="row"><button class="small primary" onclick="saveProductInfo('${jan}','a')">保存</button><button class="small" onclick="takePhoto('product','${jan}')">写真</button>${p.photoId?`<button class="small red" onclick="deletePhoto('product','${jan}')">写真削除</button>`:''}<button class="small" onclick="selectedJan='${jan}';tab('search')">詳細</button></div></div></div></div>`}
function renderSearch(){document.getElementById('search').innerHTML=`<div class="card"><b>検索</b><div class="muted">JAN入力またはカメラ読取で検索。</div><div class="muted" style="margin-top:8px">現在のカメラ: <span id="cameraName">${esc(currentCameraLabel)}</span></div><div class="muted">近距離でピントが合わない場合はカメラ切替または少し離してください。</div><div id="videoWrap" style="margin-top:10px"><video id="video" playsinline></video><div class="scanFrame"></div><div class="scanLabel">検索読取中</div></div><div class="row" style="margin-top:10px"><button class="primary" onclick="startScan('search')">カメラで検索</button><button onclick="switchCamera()">カメラ切替</button><button onclick="stopScan()">停止</button></div><div id="zoomControls">${zoomControlsHtml()}</div><div class="row" style="margin-top:10px"><input id="searchJan" inputmode="numeric" placeholder="JAN"><button onclick="searchJan(document.getElementById('searchJan').value)">検索</button></div></div><div id="searchResult">${selectedJan?productDetailHtml(selectedJan):''}</div>`}
function searchJan(v){const jan=String(v||'').replace(/\D/g,'');if(!jan)return;product(jan);selectedJan=jan;pendingBoxJan='';save();render()}
function productDetailHtml(jan){const p=product(jan),c=countsByJan(jan),boxes=Object.entries(c.boxes).sort();return`<div class="card"><div class="between"><div><b>${esc(nameOf(jan))}</b><div class="mono muted">${jan}</div></div>${photoImgHtml(p.photoId,'mini')}</div><div class="stats" style="margin-top:10px"><div class="stat"><div class="n">${c.total}</div><div class="l">総数</div></div><div class="stat"><div class="n">${c.a}</div><div class="l">A</div></div><div class="stat"><div class="n">${c.b}</div><div class="l">B</div></div></div><div class="list">${boxes.map(([bid,n])=>`<div class="item between"><span>${boxLabel(bid)}</span><b>${n}個</b></div>`).join('')||'<div class="item muted">箱登録なし</div>'}</div></div><div class="card"><b>商品情報</b><label class="muted">商品名（任意）</label><input id="pName" value="${esc(p.name)}" placeholder="例：M6ボルト"><label class="muted">メモ（任意）</label><textarea id="pMemo">${esc(p.memo)}</textarea><div class="row"><button onclick="saveProductInfo('${jan}','search')">保存</button><button onclick="takePhoto('product','${jan}')">写真を追加/変更</button>${p.photoId?`<button class="red" onclick="deletePhoto('product','${jan}')">写真削除</button>`:''}</div>${photoImgHtml(p.photoId,'thumb')}${photoPlaceholderHtml(p.photoId)}</div><div class="card"><b>箱移動</b><div class="muted">指定数量だけ、元の箱から移動先の箱へ変更します。</div><div class="row" style="margin-top:8px"><select id="moveFrom">${boxes.map(([bid,n])=>`<option value="${bid}">${boxText(bid)} (${n}個)</option>`).join('')}</select><select id="moveTo">${state.boxes.map(b=>`<option value="${b.id}">${boxText(b.id)}${b.status==='closed'?'（完了）':''}</option>`).join('')}</select><input id="moveQty" type="number" min="1" value="1"><button onclick="moveProductQty('${jan}')">移動</button></div></div>`}
function saveProductInfo(jan,from='search'){snapshot('商品情報変更 '+jan);const p=product(jan);const nameEl=document.getElementById(from==='a'?formId('aName',jan):'pName');const memoEl=document.getElementById(from==='a'?formId('aMemo',jan):'pMemo');p.name=nameEl?nameEl.value.trim():p.name;p.memo=memoEl?memoEl.value.trim():p.memo;state.last=`商品情報保存 ${jan}`;save();render()}
function moveProductQty(jan){const from=document.getElementById('moveFrom').value,to=document.getElementById('moveTo').value,qty=Math.max(1,parseInt(document.getElementById('moveQty').value||'1'));if(from===to){alert('同じ箱です');return}snapshot('箱移動 '+jan);let left=qty;for(let i=state.logs.length-1;i>=0&&left>0;i--){const l=state.logs[i];if(l.jan===jan&&l.action==='B'&&l.box===from){l.box=to;left--}}state.last=`${jan} ${from}→${to} ${qty-left}個`;save();render()}
function renderBoxes(){document.getElementById('boxes').innerHTML=`<div class="card"><div class="between"><div><b>箱一覧</b><div class="muted">箱の追加・完了・中身確認</div></div><button class="primary" onclick="addBox()">＋箱追加</button></div></div>${state.boxes.map(boxCardHtml).join('')}`}
function boxCardHtml(b){const cont=boxContents(b.id),entries=Object.entries(cont).sort((a,b)=>nameOf(a[0]).localeCompare(nameOf(b[0]),'ja')),total=entries.reduce((s,e)=>s+e[1],0);return`<div class="card"><div class="between"><div><span class="pill ${b.status==='closed'?'closed':''}">${boxLabel(b.id)}</span><div class="muted">${entries.length}種類 / ${total}個 / ${b.status==='open'?'開いている':'完了'}</div></div>${photoImgHtml(b.photoId,'mini')}</div><div class="row" style="margin-top:8px"><button class="small" onclick="setBoxStatus('${b.id}','${b.status==='open'?'closed':'open'}')">${b.status==='open'?'完了':'再開'}</button><button class="small" onclick="renameBox('${b.id}')">名前変更</button><button class="small" onclick="takePhoto('box','${b.id}')">箱写真</button>${b.photoId?`<button class="small red" onclick="deletePhoto('box','${b.id}')">写真削除</button>`:''}</div>${photoImgHtml(b.photoId,'thumb')}${photoPlaceholderHtml(b.photoId)}<div class="list">${entries.map(([jan,n])=>`<div class="item between"><div><b>${esc(nameOf(jan))}</b><div class="mono muted">${jan}</div></div><div><b>${n}個</b><button class="small" onclick="selectedJan='${jan}';tab('search')">詳細</button></div></div>`).join('')||'<div class="item muted">中身なし</div>'}</div></div>`}
function addBox(){snapshot('箱追加');const id=nextBoxId();state.boxes.push({id,status:'open',photoId:'',name:''});state.last=`箱追加 ${id}`;save();render()}
function setBoxStatus(id,status){snapshot('箱状態変更 '+id);box(id).status=status;state.last=`${boxText(id)} ${status==='open'?'再開':'完了'}`;save();render()}
function renameBox(id){const b=box(id);if(!b)return;const name=prompt(`${id} の表示名を入力してください。空欄で表示名なしに戻します。`,b.name||'');if(name===null)return;snapshot('箱表示名変更 '+id);b.name=String(name).trim();state.last=`${id} 表示名 ${b.name||'なし'}`;save();render()}
function takePhoto(type,id){photoTarget={type,id};document.getElementById('photoInput').click()}
document.getElementById('photoInput').addEventListener('change',async e=>{const f=e.target.files[0];if(!f||!photoTarget)return;try{let data=await resizeImage(f,1280,0.75);if(data.length>900000)data=await resizeImage(f,800,0.7);const target=photoTarget.type==='product'?product(photoTarget.id):box(photoTarget.id);if(!target)throw new Error('対象が見つかりません');const oldId=target.photoId||'';const id=oldId||photoIdFor(photoTarget.type,photoTarget.id);const now=new Date().toISOString();await putPhotoRecord({id,type:photoTarget.type,ownerId:photoTarget.id,dataUrl:data,createdAt:now,updatedAt:now});snapshot('写真変更');target.photoId=id;delete target.photo;state.last='写真保存';save();e.target.value='';render()}catch(err){alert('写真保存失敗: '+(err.message||err));e.target.value=''}});
async function deletePhoto(type,id){const target=type==='product'?product(id):box(id);if(!target||!target.photoId)return;const pid=target.photoId;try{await deletePhotoRecord(pid);snapshot('写真削除');delete target.photoId;delete target.photo;save();render()}catch(err){alert('写真削除失敗: '+(err.message||err))}}
function resizeImage(file,max,quality){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(Math.max(w,h)>max){const r=max/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r)}const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',quality))};img.onerror=reject;img.src=URL.createObjectURL(file)})}
function renderData(){document.getElementById('data').innerHTML=`<div class="card"><b>バックアップ / 復元</b><div class="grid" style="margin-top:10px"><button class="primary" onclick="safeBackupRaw()">安全バックアップ</button><button onclick="backupJson()">JSONバックアップ</button><button onclick="backupWithPhotos()">写真込みバックアップ</button><button onclick="document.getElementById('restoreFile').click()">JSON復元</button><button onclick="downloadProductCsv()">商品別CSV</button><button onclick="downloadBoxCsv()">箱別CSV</button></div><input id="restoreFile" type="file" accept="application/json,.json" style="display:none" onchange="restoreJson(event)"><div class="muted" style="margin-top:10px">バックアップ/復元時は旧写真データとUndo/Redo履歴を除外し、在庫データを優先して守ります。</div></div><div class="card dangerZone"><b>容量対策</b><div class="muted">履歴だけを削除します。商品・箱・スキャン数は残ります。</div><button onclick="clearHistory()">履歴クリア</button></div><div class="card dangerZone"><b>危険操作</b><div class="muted">作業前に必ず安全バックアップを保存してください。</div><button class="red" onclick="resetAll()">全データ削除</button></div>`}
function cloneStateForBackup(){if(typeof structuredClone==='function')return structuredClone(state);return JSON.parse(JSON.stringify(state))}
function stripPhotoBodies(d){Object.values(d.products||{}).forEach(p=>{if(p)delete p.photo});(d.boxes||[]).forEach(b=>{if(b)delete b.photo});return d}
function sanitizeRestoreData(src){if(!src||typeof src!=='object')throw new Error('JSONの形式が不正です');const out={products:{},boxes:[],logs:[],undo:[],redo:[],last:src.last??null};const products=src.products||{};if(typeof products!=='object'||Array.isArray(products))throw new Error('productsの形式が不正です');Object.keys(products).forEach(jan=>{const p=products[jan];if(p&&typeof p==='object'){const q={...p};delete q.photo;out.products[jan]=q}});if(!Array.isArray(src.boxes))throw new Error('boxesの形式が不正です');out.boxes=src.boxes.map((b,i)=>{if(!b||typeof b!=='object'||!('id'in b))throw new Error('boxes['+i+']の形式が不正です');const q={...b};delete q.photo;return q});if(!Array.isArray(src.logs))throw new Error('logsの形式が不正です');out.logs=src.logs.map((l,i)=>{if(!l||typeof l!=='object')throw new Error('logs['+i+']の形式が不正です');if(l.action&&l.action!=='A'&&l.action!=='B')throw new Error('logs['+i+']のactionが不正です');return {...l}});return out}
function backupStatsSig(){const s=stats();return`${s.total}|${s.a}|${s.b}`}
function warnBackupChanged(label,beforeLen,beforeSig){const afterLen=(localStorage.getItem(APP_KEY)||'').length,afterSig=backupStatsSig();if(beforeLen!==afterLen)alert('警告: '+label+'前後で保存文字数が変化しました。安全バックアップも保存してください。');if(beforeSig!==afterSig)alert('警告: '+label+'前後で総スキャン数・A数・B数が変化しました。')}
async function backupJson(){const beforeLen=(localStorage.getItem(APP_KEY)||'').length,beforeSig=backupStatsSig();try{const copy=sanitizeRestoreData(cloneStateForBackup());const json=JSON.stringify(copy,null,2);await saveBackupFile('BM001_backup_'+stamp()+'.json',json,'application/json');warnBackupChanged('JSONバックアップ',beforeLen,beforeSig)}catch(err){alert('JSONバックアップ失敗: '+(err.message||err))}}
async function safeBackupRaw(){const before=localStorage.getItem(APP_KEY)||'',beforeSig=backupStatsSig();try{let copy;try{copy=sanitizeRestoreData(JSON.parse(before||'{}'))}catch(e){copy=sanitizeRestoreData(cloneStateForBackup())}const json=JSON.stringify(copy,null,2);await saveBackupFile('BM001_safe_'+stamp()+'.json',json,'application/json');warnBackupChanged('安全バックアップ',before.length,beforeSig)}catch(err){alert('安全バックアップ失敗: '+(err.message||err))}}
async function backupWithPhotos(){const beforeLen=(localStorage.getItem(APP_KEY)||'').length,beforeSig=backupStatsSig();try{const photos=await getAllPhotoRecords();const light=sanitizeRestoreData(cloneStateForBackup());const payload={bm001Version:'V1.16',state:light,photos};const json=JSON.stringify(payload,null,2);const kb=Math.ceil(new Blob([json]).size/1024);if(!confirm(`写真込みバックアップを作成します。\n\n写真: ${photos.length}枚\n推定サイズ: ${kb} KB\n\n続行しますか？`))return;await saveBackupFile('BM001_full_'+stamp()+'.json',json,'application/json');warnBackupChanged('写真込みバックアップ',beforeLen,beforeSig)}catch(err){alert('写真込みバックアップ失敗: '+(err.message||err))}}
function validateRestoreData(d){return sanitizeRestoreData(d)}
function normalizeRestorePayload(raw){const parsed=JSON.parse(raw);const beforeBytes=new Blob([raw]).size;if(parsed&&parsed.state&&Array.isArray(parsed.photos)){const state=validateRestoreData(parsed.state);return{state,photos:parsed.photos,full:true,beforeBytes,afterBytes:new Blob([JSON.stringify(state)]).size}}const state=validateRestoreData(parsed);return{state,photos:[],full:false,beforeBytes,afterBytes:new Blob([JSON.stringify(state)]).size}}
function validatePhotoRecords(photos){if(!Array.isArray(photos))throw new Error('photosの形式が不正です');photos.forEach((p,i)=>{if(!p||typeof p!=='object'||!p.id||!p.dataUrl)throw new Error('photos['+i+']の形式が不正です')});return photos}
function restoreSummary(d,json,photos=[]){return{products:Object.keys(d.products||{}).length,boxes:(d.boxes||[]).length,logs:(d.logs||[]).length,bytes:new Blob([json]).size,photos:photos.length}}
function restoreJson(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const raw=String(r.result||'');const payload=normalizeRestorePayload(raw);const photos=validatePhotoRecords(payload.photos||[]);const json=JSON.stringify(payload.state);const s=restoreSummary(payload.state,json,photos);let msg=`復元内容を確認してください。\n\n商品: ${s.products}\n箱: ${s.boxes}\nログ: ${s.logs}\n写真: ${s.photos}\nサニタイズ前: ${Math.ceil(payload.beforeBytes/1024)} KB\nサニタイズ後: ${Math.ceil(payload.afterBytes/1024)} KB\n\n旧写真データとUndo/Redo履歴は復元しません。\n現在データに上書きしますか？`;if(s.photos>20)msg+='\n\n警告: 写真が多いため処理に時間がかかる可能性があります。';if(!confirm(msg)){e.target.value='';return}await commitRestore(payload.state,json,photos);e.target.value=''}catch(err){e.target.value='';alert('復元失敗: '+(err.message||err))}};r.onerror=()=>alert('復元失敗: ファイルを読めません');r.readAsText(f)}
async function testPhotoRestore(photos){const tempIds=[];try{for(const p of photos){const id='restore_test_'+uid();tempIds.push(id);await putPhotoRecord({id,type:p.type||'product',ownerId:p.ownerId||'',dataUrl:p.dataUrl,createdAt:p.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()})}}finally{for(const id of tempIds){try{await deletePhotoRecord(id)}catch(e){}}}}
async function commitRestore(d,json,photos=[]){const before=localStorage.getItem(APP_KEY);const oldPhotos={};const touched=[];try{localStorage.setItem(RESTORE_TEST_KEY,json);if(localStorage.getItem(RESTORE_TEST_KEY)!==json)throw new Error('保存テストに失敗しました');await testPhotoRestore(photos);for(const p of photos){oldPhotos[p.id]=await getPhotoRecord(p.id);touched.push(p.id)}for(const p of photos){await putPhotoRecord({id:p.id,type:p.type||'product',ownerId:p.ownerId||'',dataUrl:p.dataUrl,createdAt:p.createdAt||new Date().toISOString(),updatedAt:p.updatedAt||new Date().toISOString()})}localStorage.setItem(APP_KEY,json);localStorage.removeItem(RESTORE_TEST_KEY);state=d;migrate();photoCache={};render();alert('復元しました')}catch(err){try{localStorage.removeItem(RESTORE_TEST_KEY)}catch(e){}if(before!==null&&localStorage.getItem(APP_KEY)!==before){try{localStorage.setItem(APP_KEY,before)}catch(e){}}for(const id of touched){try{if(oldPhotos[id])await putPhotoRecord(oldPhotos[id]);else await deletePhotoRecord(id)}catch(e){}}alert('復元失敗: 容量不足または保存エラーです。現在データは維持しました。\n'+(err.message||err))}}
function resetAll(){if(!confirm('全データを削除します。よろしいですか？'))return;snapshot('全削除前');state={products:{},boxes:[{id:'B001',status:'open',photoId:'',name:''}],logs:[],undo:[],redo:[],last:null};save();render()}
function clearHistory(){if(!confirm('Undo/Redo履歴を削除します。商品・箱・スキャン数は残ります。よろしいですか？'))return;state.undo=[];state.redo=[];state.last='履歴クリア';save();render();alert('履歴をクリアしました')}
function stamp(){const d=new Date();return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'_'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')}
function csvEscape(v){v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function downloadProductCsv(){let rows=[['JAN','商品名','総数','A','B','箱別内訳','メモ']];Object.keys(state.products).sort().forEach(jan=>{const p=product(jan),c=countsByJan(jan);if(c.total===0&&!p.name&&!p.memo)return;rows.push([jan,p.name,c.total,c.a,c.b,Object.entries(c.boxes).map(([b,n])=>`${boxText(b)}:${n}`).join(' / '),p.memo])});download('BM001_products_'+stamp()+'.csv',rows.map(r=>r.map(csvEscape).join(',')).join('\n'),'text/csv')}
function downloadBoxCsv(){let rows=[['箱ID','箱表示名','状態','JAN','商品名','数量']];state.boxes.forEach(b=>{const cont=boxContents(b.id);Object.entries(cont).forEach(([jan,n])=>rows.push([b.id,b.name||'',b.status,jan,nameOf(jan),n]));if(Object.keys(cont).length===0)rows.push([b.id,b.name||'',b.status,'','',0])});download('BM001_boxes_'+stamp()+'.csv',rows.map(r=>r.map(csvEscape).join(',')).join('\n'),'text/csv')}
async function saveBackupFile(name,content,type){try{if(typeof File==='function'&&navigator.share&&navigator.canShare){const file=new File([content],name,{type:type+';charset=utf-8'});if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name,text:'BM-001バックアップ'});return}}}catch(e){if(e&&e.name==='AbortError')return;console.warn('Web Share API failed, fallback to download',e)}downloadRaw(name,content,type)}
function downloadRaw(name,content,type){const blob=new Blob([content],{type:type+';charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function download(name,content,type){const blob=new Blob(['\ufeff'+content],{type:type+';charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function vibrate(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function readerHints(){const lib=window.ZXingBrowser||window.ZXing||{};const formats=['EAN_13','EAN_8','UPC_A','UPC_E','CODE_128'].map(k=>lib.BarcodeFormat&&lib.BarcodeFormat[k]).filter(v=>v!==undefined);const hints=new Map();if(lib.DecodeHintType&&formats.length){hints.set(lib.DecodeHintType.POSSIBLE_FORMATS,formats);if(lib.DecodeHintType.TRY_HARDER!==undefined)hints.set(lib.DecodeHintType.TRY_HARDER,true);if(lib.DecodeHintType.ALSO_INVERTED!==undefined)hints.set(lib.DecodeHintType.ALSO_INVERTED,true)}return hints}
function makeReader(){const hints=readerHints();try{return hints.size?new ZXingBrowser.BrowserMultiFormatReader(hints,250):new ZXingBrowser.BrowserMultiFormatReader()}catch(e){return new ZXingBrowser.BrowserMultiFormatReader()}}
async function refreshCameras(){try{if(!navigator.mediaDevices?.enumerateDevices)return[];cameraDevices=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');if(selectedDeviceId&&!cameraDevices.some(d=>d.deviceId===selectedDeviceId))selectedDeviceId='';updateCameraLabel();return cameraDevices}catch(e){return cameraDevices}}
function updateCameraLabel(){const d=cameraDevices.find(x=>x.deviceId===selectedDeviceId);currentCameraLabel=d?(d.label||`カメラ ${cameraDevices.indexOf(d)+1}`):(selectedDeviceId?'選択カメラ':'自動（背面優先）');document.querySelectorAll('#cameraName').forEach(el=>el.textContent=currentCameraLabel)}
function videoConstraints(){const video={width:{ideal:1920},height:{ideal:1080},advanced:[{focusMode:'continuous'}]};if(selectedDeviceId)video.deviceId={exact:selectedDeviceId};else video.facingMode={ideal:'environment'};return{video,audio:false}}
function acceptScanCode(raw,controls){if(scanLocked)return false;const code=String(raw||'').replace(/\D/g,'');if(!code)return false;const now=Date.now();if(code===lastScanCode&&now-lastScanAt<2500)return false;scanLocked=true;lastScanCode=code;lastScanAt=now;try{controls&&controls.stop&&controls.stop()}catch(e){}stopScan(true);if(scanMode==='search')searchJan(code);else handleCode(code);return true}
function scanCallback(){return(result,err,controls)=>{if(!result)return;acceptScanCode(result.getText?result.getText():result.text,controls)}}
async function attachStream(video,constraints){const stream=await navigator.mediaDevices.getUserMedia(constraints);video.srcObject=stream;await video.play();currentTrack=stream.getVideoTracks()[0]||null;selectedDeviceId=currentTrack?.getSettings?.().deviceId||selectedDeviceId;if(selectedDeviceId)localStorage.setItem(CAMERA_KEY,selectedDeviceId);await refreshCameras();await applyCameraTuning();startOrientationScan(video);return stream}
async function applyCameraTuning(){if(!currentTrack?.getCapabilities)return;const caps=currentTrack.getCapabilities();const settings=currentTrack.getSettings?currentTrack.getSettings():{};zoomOptions=[];if(caps.zoom){const min=caps.zoom.min??1,max=caps.zoom.max??1;zoomOptions=[0.5,1,2].filter(z=>z>=min&&z<=max);if(!zoomOptions.includes(1)&&1>=min&&1<=max)zoomOptions.unshift(1);const z=Math.min(max,Math.max(min,selectedZoom||settings.zoom||1));try{await currentTrack.applyConstraints({advanced:[{focusMode:'continuous',zoom:z}]});selectedZoom=z;localStorage.setItem(ZOOM_KEY,String(z))}catch(e){try{await currentTrack.applyConstraints({advanced:[{zoom:z}]})}catch(e2){}}}else{try{await currentTrack.applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}}renderZoomControls()}
function zoomControlsHtml(){return zoomOptions.length?`<div class="row" style="margin-top:10px"><span class="muted">ズーム</span>${zoomOptions.map(z=>`<button class="small ${Math.abs((selectedZoom||1)-z)<0.01?'primary':''}" onclick="setZoom(${z})">${z}x</button>`).join('')}</div>`:''}
function renderZoomControls(){document.querySelectorAll('#zoomControls').forEach(el=>el.innerHTML=zoomControlsHtml())}
async function setZoom(z){selectedZoom=z;localStorage.setItem(ZOOM_KEY,String(z));if(currentTrack?.applyConstraints){try{await currentTrack.applyConstraints({advanced:[{zoom:z}]})}catch(e){}}renderZoomControls()}
async function switchCamera(){await refreshCameras();if(!cameraDevices.length){alert('切り替え可能なカメラが見つかりません');return}let i=cameraDevices.findIndex(d=>d.deviceId===selectedDeviceId);i=(i+1)%cameraDevices.length;selectedDeviceId=cameraDevices[i].deviceId;localStorage.setItem(CAMERA_KEY,selectedDeviceId);updateCameraLabel();if(scanner||currentTrack)startScan(scanMode)}
function stopOrientationScan(){if(frameScanTimer){clearInterval(frameScanTimer);frameScanTimer=null}frameScanBusy=false;frameReader=null}
function drawVideoAtRotation(video,canvas,ctx,deg){const vw=video.videoWidth||0,vh=video.videoHeight||0;if(!vw||!vh)return false;const maxSide=900,scale=Math.min(1,maxSide/Math.max(vw,vh)),w=Math.max(1,Math.round(vw*scale)),h=Math.max(1,Math.round(vh*scale));canvas.width=(deg%180===0)?w:h;canvas.height=(deg%180===0)?h:w;ctx.save();ctx.clearRect(0,0,canvas.width,canvas.height);if(deg===90){ctx.translate(canvas.width,0);ctx.rotate(Math.PI/2);ctx.drawImage(video,0,0,w,h)}else if(deg===180){ctx.translate(canvas.width,canvas.height);ctx.rotate(Math.PI);ctx.drawImage(video,0,0,w,h)}else if(deg===270){ctx.translate(0,canvas.height);ctx.rotate(Math.PI*1.5);ctx.drawImage(video,0,0,w,h)}else{ctx.drawImage(video,0,0,w,h)}ctx.restore();return true}
async function decodeCanvasFrame(canvas){if(!frameReader)return null;if(frameReader.decodeFromCanvas)return await frameReader.decodeFromCanvas(canvas);if(frameReader.decodeFromCanvasElement)return await frameReader.decodeFromCanvasElement(canvas);if(frameReader.decodeFromImageElement){const img=new Image();img.src=canvas.toDataURL('image/jpeg',0.82);if(img.decode)await img.decode();else await new Promise((res,rej)=>{img.onload=res;img.onerror=rej});return await frameReader.decodeFromImageElement(img)}return null}
function startOrientationScan(video){stopOrientationScan();if(!video)return;try{frameReader=makeReader()}catch(e){frameReader=null;return}const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});if(!ctx)return;frameScanTimer=setInterval(async()=>{if(frameScanBusy||scanLocked||!video.srcObject||video.readyState<2)return;frameScanBusy=true;try{for(const deg of [0,90,180,270]){if(scanLocked)break;if(!drawVideoAtRotation(video,canvas,ctx,deg))break;try{const r=await decodeCanvasFrame(canvas);if(r&&acceptScanCode(r.getText?r.getText():r.text))break}catch(e){}}}finally{frameScanBusy=false}},ORIENTATION_SCAN_INTERVAL_MS)}
async function startScan(mode){scanMode=mode;scanLocked=false;stopScan();await refreshCameras();const activeView=document.querySelector('.view.active')||document;const wrap=activeView.querySelector('#videoWrap'),video=activeView.querySelector('video');if(!wrap||!video){alert('カメラ画面が見つかりません');return}wrap.style.display='block';const onResult=scanCallback();try{scanner=makeReader();const constraints=videoConstraints();if(scanner.decodeFromConstraints){await scanner.decodeFromConstraints(constraints,video,onResult);setTimeout(async()=>{if(video.srcObject){currentTrack=video.srcObject.getVideoTracks()[0]||currentTrack;selectedDeviceId=currentTrack?.getSettings?.().deviceId||selectedDeviceId;if(selectedDeviceId)localStorage.setItem(CAMERA_KEY,selectedDeviceId);await refreshCameras();await applyCameraTuning();startOrientationScan(video)}},300)}else{await attachStream(video,constraints);await scanner.decodeFromVideoElement(video,onResult)}}catch(e1){try{scanner=makeReader();selectedDeviceId='';localStorage.removeItem(CAMERA_KEY);const constraints=videoConstraints();await attachStream(video,constraints);await scanner.decodeFromVideoElement(video,onResult)}catch(e2){scanLocked=false;stopScan();alert('カメラ読取を開始できません。HTTPSで開いているか、カメラ許可を確認してください。\n'+(e2.message||e1.message))}}}
function stopScan(keepLock=false){stopOrientationScan();try{scanner&&scanner.reset&&scanner.reset()}catch(e){}document.querySelectorAll('video').forEach(v=>{try{if(v.srcObject){v.srcObject.getTracks().forEach(t=>t.stop());v.srcObject=null}}catch(e){}});scanner=null;currentTrack=null;if(!keepLock)scanLocked=false;document.querySelectorAll('#videoWrap').forEach(w=>w.style.display='none')}
function showWhatsNew(){alert('BM-001 V1.16\n\n・A一覧に並び替えを追加\n・初期表示は最終スキャン順\n・JAN順、商品名順、写真あり/なし優先、商品名なし優先に対応\n・並び順は次回起動時も維持')}
load();render();updateFab();migrateLegacyPhotos();
</script>
