<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>BoxMaster BM-001 V1.06</title>
<script src="https://unpkg.com/@zxing/browser@latest"></script>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#111;--muted:#667085;--line:#d7dbe2;--black:#111;--blue:#1455d9;--green:#147a3d;--red:#b42318;--amber:#b76e00}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:20;background:#111;color:#fff;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));box-shadow:0 2px 8px #0002}header h1{margin:0;font-size:17px}.sub{font-size:12px;opacity:.78;margin-top:2px}main{max-width:860px;margin:auto;padding:10px 10px 92px}.view{display:none}.view.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;margin:10px 0;box-shadow:0 1px 3px #00000010}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{display:flex;align-items:center;justify-content:space-between;gap:8px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:#fafafa;border:1px solid var(--line);border-radius:14px;padding:12px}.stat .n{font-size:25px;font-weight:800}.stat .l{font-size:12px;color:var(--muted)}button,input,textarea,select{font-size:16px;border-radius:12px;border:1px solid #b8bec8;background:#fff;padding:11px 12px}button{font-weight:750;cursor:pointer}button.primary{background:#111;color:#fff;border-color:#111}button.blue{background:var(--blue);color:#fff;border-color:var(--blue)}button.green{background:var(--green);color:#fff;border-color:var(--green)}button.red{background:var(--red);color:#fff;border-color:var(--red)}button.amber{background:var(--amber);color:#fff;border-color:var(--amber)}button.ghost{background:#fff;color:#111}button.small{font-size:13px;padding:7px 9px;border-radius:10px}button.full{width:100%}input,textarea,select{width:100%}textarea{min-height:72px}.muted{color:var(--muted);font-size:13px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid #b8bec8;border-radius:999px;padding:8px 10px;background:#fff;font-weight:750}.pill.closed{opacity:.55;text-decoration:line-through}.notice{border-radius:16px;padding:14px;color:#fff}.notice.a{background:var(--green)}.notice.b{background:var(--blue)}.notice.err{background:var(--red)}.big{font-size:28px;font-weight:850}.boxbtn{min-width:82px}.thumb{width:100%;max-height:260px;object-fit:contain;background:#eee;border-radius:14px;border:1px solid var(--line)}.mini{width:72px;height:72px;object-fit:cover;border-radius:12px;border:1px solid var(--line);background:#eee}.list{border-top:1px solid var(--line);margin-top:8px}.item{padding:10px 0;border-bottom:1px solid var(--line)}#videoWrap{display:none;background:#000;border-radius:16px;overflow:hidden;position:relative}video{width:100%;display:block;max-height:48vh;object-fit:cover}.scanLabel{position:absolute;top:10px;left:10px;background:#000a;color:#fff;padding:6px 9px;border-radius:999px;font-size:12px}.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:#cfd4dc;padding-bottom:env(safe-area-inset-bottom)}.tabs button{border:0;border-radius:0;background:#fff;font-size:12px;padding:11px 2px}.tabs button.active{background:#111;color:#fff}.fabScan{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:45;width:76px;height:76px;border-radius:999px;background:#111;color:#fff;border:2px solid #fff;box-shadow:0 8px 22px #0005;font-size:30px;display:none;align-items:center;justify-content:center;padding:0}.fabScan.show{display:flex}.dangerZone{border-color:#f1b8b3;background:#fff8f7}@media(min-width:720px){.stats{grid-template-columns:repeat(5,1fr)}.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header><h1>📦 BoxMaster BM-001</h1><div class="sub">V1.06 / JAN整理・3個残し・箱別数量管理</div></header>
<main>
<section id="home" class="view active"></section>
<section id="scan" class="view"></section>
<section id="search" class="view"></section>
<section id="boxes" class="view"></section>
<section id="data" class="view"></section>
</main>
<nav class="tabs">
<button data-tab="home" class="active">ホーム</button><button data-tab="scan">スキャン</button><button data-tab="search">検索</button><button data-tab="boxes">箱</button><button data-tab="data">データ</button>
</nav>
<button id="fabScan" class="fabScan" onclick="quickStartScan()" aria-label="スキャン開始">📷</button>
<input id="photoInput" type="file" accept="image/*" capture="environment" style="display:none">
<script>
const APP_KEY='BM001_V100_DATA'; // V1.01も同じ保存領域を使い、既存データを引き継ぐ
let state={products:{},boxes:[{id:'B001',status:'open'}],logs:[],undo:[],last:null};
let currentTab='home', scanner=null, scanMode='scan', selectedBox=null, selectedJan=null, pendingBoxJan='', photoTarget=null;
let scanLocked=false, lastScanCode='', lastScanAt=0;
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function load(){try{const s=localStorage.getItem(APP_KEY); if(s) state=JSON.parse(s)}catch(e){alert('保存データ読込に失敗しました')}}
function save(){localStorage.setItem(APP_KEY,JSON.stringify(state))}
function snapshot(label){state.undo.unshift({label,at:new Date().toISOString(),data:JSON.stringify({products:state.products,boxes:state.boxes,logs:state.logs,last:state.last})});state.undo=state.undo.slice(0,50)}
function undo(){const u=state.undo.shift(); if(!u){alert('取り消す操作がありません');return} const d=JSON.parse(u.data); state.products=d.products;state.boxes=d.boxes;state.logs=d.logs;state.last=d.last;save();render();alert('取り消しました: '+u.label)}
function product(jan){if(!state.products[jan]) state.products[jan]={jan,name:'',memo:'',photo:''}; return state.products[jan]}
function openBoxes(){return state.boxes.filter(b=>b.status==='open')}
function box(id){return state.boxes.find(b=>b.id===id)}
function nextBoxId(){let max=0;state.boxes.forEach(b=>{const m=String(b.id).match(/^B(\d+)$/);if(m)max=Math.max(max,parseInt(m[1]))});return 'B'+String(max+1).padStart(3,'0')}
function countsByJan(jan){const res={total:0,a:0,b:0,boxes:{}};state.logs.forEach(l=>{if(l.jan!==jan)return;res.total++; if(l.action==='A')res.a++; else{res.b++;res.boxes[l.box]=(res.boxes[l.box]||0)+1}});return res}
function boxContents(boxId){const m={};state.logs.forEach(l=>{if(l.action==='B'&&l.box===boxId)m[l.jan]=(m[l.jan]||0)+1});return m}
function stats(){const jans=new Set(state.logs.map(l=>l.jan));let a=0,b=0;state.logs.forEach(l=>l.action==='A'?a++:b++);return{types:jans.size,total:state.logs.length,a,b,open:openBoxes().length,closed:state.boxes.filter(x=>x.status==='closed').length}}
function nameOf(jan){const p=state.products[jan];return p&&p.name?p.name:jan}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function tab(id){currentTab=id;document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id));document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===id)); stopScan(); render(); updateFab()}
function updateFab(){const f=document.getElementById('fabScan'); if(f) f.classList.toggle('show', currentTab==='scan')}
function quickStartScan(){if(currentTab!=='scan'){tab('scan');setTimeout(()=>startScan('scan'),80)}else{startScan('scan')}}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
function render(){renderHome();renderScan();renderSearch();renderBoxes();renderData()}
function renderHome(){const s=stats();document.getElementById('home').innerHTML=`<div class="card"><div class="between"><div><b>ホーム</b><div class="muted">現在の進捗</div></div><button class="small" onclick="render()">更新</button></div><div class="stats" style="margin-top:10px"><div class="stat"><div class="n">${s.types}</div><div class="l">商品種類</div></div><div class="stat"><div class="n">${s.total}</div><div class="l">総スキャン数</div></div><div class="stat"><div class="n">${s.a}</div><div class="l">A保管</div></div><div class="stat"><div class="n">${s.b}</div><div class="l">B保管</div></div><div class="stat"><div class="n">${s.open}/${s.closed}</div><div class="l">開箱/完了箱</div></div></div></div><div class="grid"><button class="primary" onclick="tab('scan')">📷 スキャン</button><button onclick="tab('search')">🔍 検索</button><button onclick="tab('boxes')">📦 箱一覧</button><button onclick="tab('data')">💾 バックアップ</button></div>${state.last?`<div class="card"><div class="between"><div><b>最後の操作</b><div class="muted mono">${esc(state.last)}</div></div><button class="amber" onclick="undo()">取り消し</button></div></div>`:''}`}
function renderScan(){const open=openBoxes();document.getElementById('scan').innerHTML=`<div class="card"><div class="between"><div><b>スキャン</b><div class="muted">JANを読む。4個目以降は箱を選択。</div></div><button class="small" onclick="undo()">取り消し</button></div><div id="videoWrap" style="margin-top:10px"><video id="video" playsinline></video><div class="scanLabel">JAN読取中</div></div><div class="row" style="margin-top:10px"><button class="primary" onclick="startScan('scan')">カメラで読む</button><button onclick="stopScan()">停止</button></div><div class="row" style="margin-top:10px"><input id="manualJan" inputmode="numeric" placeholder="手入力JAN"><button onclick="manualScan()">登録</button></div></div><div class="card"><b>開いている箱</b><div class="row" style="margin-top:8px">${open.map(b=>`<span class="pill">${b.id}</span>`).join('')||'<span class="muted">開いている箱がありません</span>'}<button class="small" onclick="addBox()">＋箱追加</button></div></div><div id="scanResult">${scanResultHtml()}</div>`}
function scanResultHtml(){
  if(!selectedJan)return'';
  const c=countsByJan(selectedJan),p=product(selectedJan);
  if(pendingBoxJan===selectedJan){
    const lastBox=lastBoxFor(selectedJan);
    return`<div class="notice b"><div class="big">箱を選択</div><div>${esc(nameOf(selectedJan))}</div><div class="mono">${selectedJan}</div><div>累計 ${c.total+1} 個目として登録します</div><div class="muted" style="color:#fff;opacity:.85">箱を選ぶまでは、この1個は未登録です。</div></div><div class="card"><div class="row">${lastBox&&box(lastBox)?.status==='open'?`<button class="blue boxbtn" onclick="putInBox('${selectedJan}','${lastBox}')">前回 ${lastBox}</button>`:''}${openBoxes().map(b=>`<button class="boxbtn" onclick="putInBox('${selectedJan}','${b.id}')">${b.id}</button>`).join('')}<button onclick="addBox();render()">＋箱追加</button></div></div>`;
  }
  const last=lastLogFor(selectedJan);
  if(last && last.action==='B'){
    return`<div class="notice b"><div class="big">${esc(last.box)}へ登録</div><div>${esc(nameOf(selectedJan))}</div><div class="mono">${selectedJan}</div><div>累計 ${c.total} 個 / B ${c.b} 個</div><div style="margin-top:10px"><button onclick="changeLastBox('${selectedJan}')">別の箱に変更</button></div></div>`;
  }
  return`<div class="notice a"><div class="big">Aに残す</div><div>${esc(nameOf(selectedJan))}</div><div class="mono">${selectedJan}</div><div>累計 ${c.total} 個 / A ${c.a} 個</div></div>`;
}
function lastBoxFor(jan){for(let i=state.logs.length-1;i>=0;i--){const l=state.logs[i];if(l.jan===jan&&l.action==='B')return l.box}return''}
function lastLogFor(jan){for(let i=state.logs.length-1;i>=0;i--){const l=state.logs[i];if(l.jan===jan)return l}return null}
function manualScan(){const v=document.getElementById('manualJan').value.trim(); if(v) handleCode(v);document.getElementById('manualJan').value=''}
function handleCode(raw){
  const jan=String(raw).replace(/\D/g,''); if(!jan){return}
  const c=countsByJan(jan); product(jan); selectedJan=jan;
  if(c.total<3){
    pendingBoxJan='';snapshot('スキャン取り消し '+jan);state.logs.push({id:uid(),jan,action:'A'});state.last=`${jan} → A`;save();vibrate([50]);render();return;
  }
  const lastBox=lastBoxFor(jan);
  if(lastBox && box(lastBox)?.status==='open'){
    pendingBoxJan='';snapshot('箱自動登録取り消し '+jan+' → '+lastBox);state.logs.push({id:uid(),jan,action:'B',box:lastBox});state.last=`${jan} → ${lastBox}`;save();vibrate([80]);render();return;
  }
  pendingBoxJan=jan;render();vibrate([30,40,30]);
}
function putInBox(jan,boxId){snapshot('箱登録取り消し '+jan+' → '+boxId);state.logs.push({id:uid(),jan,action:'B',box:boxId});state.last=`${jan} → ${boxId}`;selectedJan=jan;pendingBoxJan='';save();vibrate([80]);render()}
function changeLastBox(jan){
  const l=lastLogFor(jan); if(!l||l.action!=='B'){return}
  const choices=openBoxes().map(b=>b.id).filter(id=>id!==l.box);
  if(!choices.length){alert('他に開いている箱がありません。先に箱を追加してください。');return}
  const to=prompt('移動先の箱番号を入力してください\n候補: '+choices.join(', '), choices[0]);
  if(!to)return;
  if(!box(to)){alert('その箱はありません');return}
  snapshot('直前箱変更 '+jan); l.box=to; state.last=`${jan} ${l.box}へ変更`; save(); render();
}
function vibrate(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
async function startScan(mode){
  scanMode=mode;
  scanLocked=false;
  stopScan(); // 以前のカメラ状態を必ず破棄する。iPhoneで2回目にインカメラへ戻る対策。
  const activeView=document.querySelector('.view.active') || document;
  const wrap=activeView.querySelector('#videoWrap');
  const video=activeView.querySelector('video');
  if(!wrap || !video){alert('カメラ画面が見つかりません');return}
  wrap.style.display='block';
  try{
    scanner=new ZXingBrowser.BrowserMultiFormatReader();
    const onResult=(result,err,controls)=>{
      if(!result || scanLocked) return;
      const code=String(result.getText()||'').replace(/\D/g,'');
      const now=Date.now();
      if(code===lastScanCode && now-lastScanAt<2500) return;
      scanLocked=true;
      lastScanCode=code;
      lastScanAt=now;
      try{controls&&controls.stop&&controls.stop()}catch(e){}
      stopScan();
      if(scanMode==='search') searchJan(code); else handleCode(code);
    };
    // iPhone Safariではデバイス一覧の先頭がインカメラになることがあるため、まず環境カメラを明示指定する。
    const constraints={video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false};
    if(scanner.decodeFromConstraints){
      await scanner.decodeFromConstraints(constraints,video,onResult);
    }else{
      const stream=await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject=stream;
      await video.play();
      await scanner.decodeFromVideoElement(video,onResult);
    }
  }catch(e1){
    // 端末によっては facingMode 指定が失敗するため、背面らしいデバイスIDへフォールバック。
    try{
      scanner=new ZXingBrowser.BrowserMultiFormatReader();
      const devices=await ZXingBrowser.BrowserCodeReader.listVideoInputDevices();
      const back=devices.find(d=>/back|rear|environment|背面|後面/i.test(d.label))||devices[devices.length-1]||devices[0];
      await scanner.decodeFromVideoDevice(back?.deviceId,video,(result,err,controls)=>{
        if(!result || scanLocked) return;
        const code=String(result.getText()||'').replace(/\D/g,'');
        const now=Date.now();
        if(code===lastScanCode && now-lastScanAt<2500) return;
        scanLocked=true;
        lastScanCode=code;
        lastScanAt=now;
        try{controls&&controls.stop&&controls.stop()}catch(e){}
        stopScan();
        if(scanMode==='search') searchJan(code); else handleCode(code);
      })
    }catch(e2){
      scanLocked=false;
      alert('カメラ読取を開始できません。HTTPSで開いているか、カメラ許可を確認してください。\n'+(e2.message||e1.message))
    }
  }
}
function stopScan(){
  try{scanner&&scanner.reset&&scanner.reset()}catch(e){}
  document.querySelectorAll('video').forEach(v=>{try{if(v.srcObject){v.srcObject.getTracks().forEach(t=>t.stop());v.srcObject=null}}catch(e){}});
  scanner=null;
  scanLocked=false;
  document.querySelectorAll('#videoWrap').forEach(w=>w.style.display='none')
}
function addBox(){snapshot('箱追加');const id=nextBoxId();state.boxes.push({id,status:'open',photo:''});state.last=`箱追加 ${id}`;save();render()}
function setBoxStatus(id,status){snapshot('箱状態変更 '+id);box(id).status=status;state.last=`${id} ${status==='open'?'再開':'完了'}`;save();render()}
function renderSearch(){document.getElementById('search').innerHTML=`<div class="card"><b>検索</b><div class="muted">JAN入力またはカメラ読取で検索。</div><div id="videoWrap" style="margin-top:10px"><video id="video" playsinline></video><div class="scanLabel">検索読取中</div></div><div class="row" style="margin-top:10px"><button class="primary" onclick="startScan('search')">カメラで検索</button><button onclick="stopScan()">停止</button></div><div class="row" style="margin-top:10px"><input id="searchJan" inputmode="numeric" placeholder="JAN"><button onclick="searchJan(document.getElementById('searchJan').value)">検索</button></div></div><div id="searchResult">${selectedJan?productDetailHtml(selectedJan):''}</div>`}
function searchJan(v){const jan=String(v||'').replace(/\D/g,''); if(!jan)return; product(jan);selectedJan=jan;pendingBoxJan='';save();render()}
function productDetailHtml(jan){const p=product(jan),c=countsByJan(jan);const boxes=Object.entries(c.boxes).sort();return`<div class="card"><div class="between"><div><b>${esc(nameOf(jan))}</b><div class="mono muted">${jan}</div></div>${p.photo?`<img class="mini" src="${p.photo}">`:''}</div><div class="stats" style="margin-top:10px"><div class="stat"><div class="n">${c.total}</div><div class="l">総数</div></div><div class="stat"><div class="n">${c.a}</div><div class="l">A</div></div><div class="stat"><div class="n">${c.b}</div><div class="l">B</div></div></div><div class="list">${boxes.map(([bid,n])=>`<div class="item between"><span>${bid}</span><b>${n}個</b></div>`).join('')||'<div class="item muted">箱登録なし</div>'}</div></div><div class="card"><b>商品情報</b><label class="muted">商品名（任意）</label><input id="pName" value="${esc(p.name)}" placeholder="例：M6ボルト"><label class="muted">メモ（任意）</label><textarea id="pMemo">${esc(p.memo)}</textarea><div class="row"><button onclick="saveProductInfo('${jan}')">保存</button><button onclick="takePhoto('product','${jan}')">写真を追加/変更</button>${p.photo?`<button class="red" onclick="deletePhoto('product','${jan}')">写真削除</button>`:''}</div>${p.photo?`<img class="thumb" src="${p.photo}" style="margin-top:10px">`:''}</div><div class="card"><b>箱移動</b><div class="muted">指定数量だけ、元の箱から移動先の箱へ変更します。</div><div class="row" style="margin-top:8px"><select id="moveFrom">${boxes.map(([bid,n])=>`<option value="${bid}">${bid} (${n}個)</option>`).join('')}</select><select id="moveTo">${state.boxes.map(b=>`<option value="${b.id}">${b.id}${b.status==='closed'?'（完了）':''}</option>`).join('')}</select><input id="moveQty" type="number" min="1" value="1"><button onclick="moveProductQty('${jan}')">移動</button></div></div>`}
function saveProductInfo(jan){snapshot('商品情報変更 '+jan);const p=product(jan);p.name=document.getElementById('pName').value.trim();p.memo=document.getElementById('pMemo').value.trim();state.last=`商品情報保存 ${jan}`;save();render()}
function moveProductQty(jan){const from=document.getElementById('moveFrom').value,to=document.getElementById('moveTo').value,qty=Math.max(1,parseInt(document.getElementById('moveQty').value||'1')); if(from===to){alert('同じ箱です');return} snapshot('箱移動 '+jan);let left=qty;for(let i=state.logs.length-1;i>=0&&left>0;i--){const l=state.logs[i];if(l.jan===jan&&l.action==='B'&&l.box===from){l.box=to;left--}}state.last=`${jan} ${from}→${to} ${qty-left}個`;save();render()}
function renderBoxes(){document.getElementById('boxes').innerHTML=`<div class="card"><div class="between"><div><b>箱一覧</b><div class="muted">箱の追加・完了・中身確認</div></div><button class="primary" onclick="addBox()">＋箱追加</button></div></div>${state.boxes.map(b=>boxCardHtml(b)).join('')}`}
function boxCardHtml(b){const cont=boxContents(b.id),entries=Object.entries(cont).sort((a,b)=>nameOf(a[0]).localeCompare(nameOf(b[0]),'ja'));const total=entries.reduce((s,e)=>s+e[1],0);return`<div class="card"><div class="between"><div><span class="pill ${b.status==='closed'?'closed':''}">${b.id}</span><div class="muted">${entries.length}種類 / ${total}個 / ${b.status==='open'?'開いている':'完了'}</div></div>${b.photo?`<img class="mini" src="${b.photo}">`:''}</div><div class="row" style="margin-top:8px"><button class="small" onclick="setBoxStatus('${b.id}','${b.status==='open'?'closed':'open'}')">${b.status==='open'?'完了':'再開'}</button><button class="small" onclick="takePhoto('box','${b.id}')">箱写真</button>${b.photo?`<button class="small red" onclick="deletePhoto('box','${b.id}')">写真削除</button>`:''}</div>${b.photo?`<img class="thumb" src="${b.photo}" style="margin-top:10px">`:''}<div class="list">${entries.map(([jan,n])=>`<div class="item between"><div><b>${esc(nameOf(jan))}</b><div class="mono muted">${jan}</div></div><div><b>${n}個</b><button class="small" onclick="selectedJan='${jan}';tab('search')">詳細</button></div></div>`).join('')||'<div class="item muted">中身なし</div>'}</div></div>`}
function takePhoto(type,id){photoTarget={type,id};document.getElementById('photoInput').click()}
document.getElementById('photoInput').addEventListener('change',async e=>{const f=e.target.files[0]; if(!f||!photoTarget)return; const data=await resizeImage(f,1280,0.82);snapshot('写真変更'); if(photoTarget.type==='product')product(photoTarget.id).photo=data; else box(photoTarget.id).photo=data; state.last='写真保存'; save();e.target.value='';render()});
function deletePhoto(type,id){snapshot('写真削除'); if(type==='product')product(id).photo=''; else box(id).photo=''; save();render()}
function resizeImage(file,max,quality){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(Math.max(w,h)>max){const r=max/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r)}const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',quality))};img.onerror=reject;img.src=URL.createObjectURL(file)})}
function renderData(){document.getElementById('data').innerHTML=`<div class="card"><b>バックアップ / 復元</b><div class="grid" style="margin-top:10px"><button class="primary" onclick="backupJson()">JSONバックアップ</button><button onclick="document.getElementById('restoreFile').click()">JSON復元</button><button onclick="downloadProductCsv()">商品別CSV</button><button onclick="downloadBoxCsv()">箱別CSV</button></div><input id="restoreFile" type="file" accept="application/json,.json" style="display:none" onchange="restoreJson(event)"><div class="muted" style="margin-top:10px">JSONは完全復元用、CSVはExcel確認用です。</div></div><div class="card dangerZone"><b>危険操作</b><div class="muted">試作中のため、作業前に必ずJSONバックアップを保存してください。</div><button class="red" onclick="resetAll()">全データ削除</button></div>`}
function backupJson(){download('BM001_backup_'+stamp()+'.json',JSON.stringify(state,null,2),'application/json')}
function restoreJson(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.products||!d.boxes||!d.logs)throw new Error('形式不正');snapshot('復元前');state=d;save();render();alert('復元しました')}catch(err){alert('復元失敗: '+err.message)}};r.readAsText(f)}
function resetAll(){if(!confirm('全データを削除します。よろしいですか？'))return;snapshot('全削除前');state={products:{},boxes:[{id:'B001',status:'open'}],logs:[],undo:[],last:null};save();render()}
function stamp(){const d=new Date();return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'_'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')}
function csvEscape(v){v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function downloadProductCsv(){let rows=[['JAN','商品名','総数','A','B','箱別内訳','メモ']];Object.keys(state.products).sort().forEach(jan=>{const p=product(jan),c=countsByJan(jan);if(c.total===0&&!p.name&&!p.memo)return;rows.push([jan,p.name,c.total,c.a,c.b,Object.entries(c.boxes).map(([b,n])=>`${b}:${n}`).join(' / '),p.memo])});download('BM001_products_'+stamp()+'.csv',rows.map(r=>r.map(csvEscape).join(',')).join('\n'),'text/csv')}
function downloadBoxCsv(){let rows=[['箱','状態','JAN','商品名','数量']];state.boxes.forEach(b=>{const cont=boxContents(b.id);Object.entries(cont).forEach(([jan,n])=>rows.push([b.id,b.status,jan,nameOf(jan),n]));if(Object.keys(cont).length===0)rows.push([b.id,b.status,'','',0])});download('BM001_boxes_'+stamp()+'.csv',rows.map(r=>r.map(csvEscape).join(',')).join('\n'),'text/csv')}
function download(name,content,type){const blob=new Blob(['\ufeff'+content],{type:type+';charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
load();render();updateFab();
</script>
